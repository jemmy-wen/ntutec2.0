function useInView(opts = {}) {
  const ref = useRef(null);
  const [v, setV] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setV(true); obs.disconnect(); } }, { threshold: opts.threshold || 0.08 });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return [ref, v];
}
function AnimUp({ children, delay = 0, style = {} }) {
  const [ref, v] = useInView();
  return <div ref={ref} style={{ opacity: v ? 1 : 0, transform: v ? 'none' : 'translateY(24px)', transition: `opacity 0.65s cubic-bezier(0.22,1,0.36,1) ${delay}ms, transform 0.65s cubic-bezier(0.22,1,0.36,1) ${delay}ms`, ...style }}>{children}</div>;
}

            <React.Fragment key={i}>
              {i > 0 && <div style={{ width:1, background:'var(--rule)', alignSelf:'stretch' }} />}
              <div style={{ background:'#fff', padding:'20px 36px' }}>
                <div style={{ fontFamily:'Georgia, serif', fontStyle:'italic', fontWeight:600, fontSize:36, lineHeight:1, color:'var(--navy)', marginBottom:5 }}>{s.num}</div>
                <div style={{ fontFamily:'var(--sans)', fontSize:11.5, color:'var(--muted)' }}>{s.label}</div>
              </div>
            </React.Fragment>
          ))}
        </div>

        {/* Large search panel */}
        <div style={{ position:'absolute', left:0, right:0, bottom:0, transform:'translateY(50%)', zIndex:20, padding: isMobile ? '0 6%' : '0 10%', maxWidth:1280, margin:'0 auto', opacity: loaded?1:0, transition:'opacity 0.65s 0.4s' }}>
        <div className="search-panel" style={{
          width: '100%',
          borderRadius: isMobile ? 14 : 2,
          padding: isMobile ? 16 : 10,
          display:'grid',
          gridTemplateColumns: isMobile ? '1fr' : '1fr auto',
          gap: isMobile ? 14 : 10,
        }}>
          <div style={{ display:'grid', gridTemplateColumns: isMobile ? '1fr' : '138px 1fr', alignItems:'center', gap: isMobile ? 10 : 0 }}>
            <div style={{ display:'flex', alignItems:'center', gap:10, padding: isMobile ? '0 2px' : '0 18px' }}>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--teal)" strokeWidth="1.8" strokeLinecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
              <div style={{ fontFamily:'var(--mono)', fontSize:10.5, letterSpacing:'0.12em', color:'var(--navy)', textTransform:'uppercase', whiteSpace:'nowrap' }}>
                {queryCount ? `${queryCount} 筆關鍵字` : 'Search'}
              </div>
            </div>
            <textarea
              className="search-textarea"
              style={{ borderLeft: isMobile ? 0 : '1px solid var(--rule)', paddingLeft: isMobile ? 2 : 18 }}
              placeholder={"輸入 AI、生醫、B2B 或多個團隊名稱，以逗號 / 空白 / 換行分隔"}
              value={query}
              onChange={e => setQuery(e.target.value)}
            />
          </div>
          <button
            onClick={() => document.getElementById('team-results')?.scrollIntoView({ behavior: 'smooth', block: 'start' })}
            style={{ border:0, borderRadius:2, background:'var(--mint)', color:'var(--navy)', fontFamily:'var(--sans)', fontSize:14, fontWeight:600, padding: isMobile ? '12px 18px' : '0 30px', cursor:'pointer', minHeight:46, letterSpacing:'0.04em' }}
          >
            搜尋
          </button>
        </div>
        </div>
      </section>
    </div>
  );
}

/* ── Filter sidebar ── */
function FilterSidebar({ filters, setFilters, total, filtered }) {
  const isMobile = useIsMobile();

  function toggle(group, val) {
    setFilters(prev => {
      const arr = prev[group];
      return { ...prev, [group]: arr.includes(val) ? arr.filter(x => x !== val) : [...arr, val] };
    });
  }
  function clearAll() { setFilters({ bm: [], ntu: [] }); }
  const hasActive = filters.bm.length > 0 || filters.ntu.length > 0;

  const bmOptions = ['B2B','B2C','B2B2C','C2C','C2B','B2G','O2O'];
  const ntuOptions = [
    { label:'台大在學學生', val:'在學' },
    { label:'台大校友', val:'校友' },
    { label:'台大創創學程', val:'創創學程' },
    { label:'台大 MBA', val:'MBA' },
    { label:'無台大背景', val:'無' },
  ];

  if (isMobile) {
    return (
      <div style={{ padding:'18px 6% 6px', display:'flex', flexWrap:'wrap', gap:8, alignItems:'center' }}>
        <span style={{ fontFamily:'var(--mono)', fontSize:10, letterSpacing:'0.12em', color:'var(--muted)', marginRight:4 }}>FILTER</span>
        {bmOptions.map(o => (
          <button key={o} onClick={() => toggle('bm', o)} style={{ padding:'6px 12px', borderRadius:2, fontSize:12, fontFamily:'var(--sans)', fontWeight:500, cursor:'pointer', background: filters.bm.includes(o) ? 'var(--navy)' : '#fff', color: filters.bm.includes(o) ? '#fff' : 'var(--muted)', border:'1px solid var(--rule)', transition:'all 0.18s' }}>{o}</button>
        ))}
        {ntuOptions.map(o => (
          <button key={o.val} onClick={() => toggle('ntu', o.val)} style={{ padding:'6px 12px', borderRadius:2, fontSize:12, fontFamily:'var(--sans)', fontWeight:500, cursor:'pointer', background: filters.ntu.includes(o.val) ? 'var(--teal)' : '#fff', color: filters.ntu.includes(o.val) ? '#fff' : 'var(--muted)', border:'1px solid var(--rule)', transition:'all 0.18s' }}>{o.label}</button>
        ))}
        {hasActive && <button onClick={clearAll} style={{ padding:'6px 12px', fontSize:11, fontFamily:'var(--mono)', letterSpacing:'0.08em', color:'var(--navy)', background:'transparent', border:'1px solid var(--rule)', cursor:'pointer' }}>清除</button>}
        <span style={{ marginLeft:'auto', fontFamily:'var(--mono)', fontSize:11, color:'var(--muted)' }}>{filtered} / {total}</span>
      </div>
    );
  }

  return (
    <aside style={{ width:260, flexShrink:0, alignSelf:'flex-start', position:'sticky', top:92 }}>
      <div style={{ borderTop:'2px solid var(--navy)', paddingTop:18, marginBottom:18 }}>
        <div style={{ fontFamily:'var(--mono)', fontSize:10, letterSpacing:'0.16em', color:'var(--teal)', textTransform:'uppercase', marginBottom:8 }}>Filter Results</div>
        <div style={{ display:'flex', alignItems:'baseline', gap:8 }}>
          <span style={{ fontFamily:'var(--serif)', fontSize:36, fontWeight:600, color:'var(--navy)', lineHeight:1 }}>{filtered}</span>
          <span style={{ fontFamily:'var(--sans)', fontSize:13, color:'var(--muted)' }}>/ {total} teams</span>
        </div>
        <p style={{ fontFamily:'var(--sans)', fontSize:12.5, fontWeight:300, lineHeight:1.7, color:'var(--muted)', marginTop:10 }}>
          用商業模式與台大背景縮小結果，搜尋列可再搭配多筆關鍵字。
        </p>
        {hasActive && (
          <button onClick={clearAll} style={{ marginTop:14, width:'100%', padding:'10px 12px', background:'var(--navy)', color:'#fff', border:'none', borderRadius:2, fontFamily:'var(--mono)', fontSize:10.5, letterSpacing:'0.1em', cursor:'pointer' }}>
            CLEAR FILTERS
          </button>
        )}
      </div>

      <div style={{ background:'#fff', border:'1px solid var(--rule)', padding:'22px 20px', marginBottom:14 }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12 }}>
          <div style={{ fontFamily:'var(--sans)', fontSize:13, fontWeight:600, color:'var(--navy)', letterSpacing:'0.04em' }}>商業模式</div>
          <span style={{ fontFamily:'var(--mono)', fontSize:10, color:'var(--muted)' }}>{filters.bm.length || 'ALL'}</span>
        </div>
        {bmOptions.map(o => (
          <label key={o} className="filter-check">
            <input type="checkbox" checked={filters.bm.includes(o)} onChange={() => toggle('bm', o)} />
            <span style={{ fontFamily:'var(--sans)', fontSize:13.5, color: filters.bm.includes(o) ? 'var(--navy)' : 'var(--muted)', fontWeight: filters.bm.includes(o) ? 500 : 300 }}>{o}</span>
          </label>
        ))}
      </div>

      <div style={{ background:'#fff', border:'1px solid var(--rule)', padding:'22px 20px' }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12 }}>
          <div style={{ fontFamily:'var(--sans)', fontSize:13, fontWeight:600, color:'var(--navy)', letterSpacing:'0.04em' }}>台大背景</div>
          <span style={{ fontFamily:'var(--mono)', fontSize:10, color:'var(--muted)' }}>{filters.ntu.length || 'ALL'}</span>
        </div>
        {ntuOptions.map(o => (
          <label key={o.val} className="filter-check">
            <input type="checkbox" checked={filters.ntu.includes(o.val)} onChange={() => toggle('ntu', o.val)} />
            <span style={{ fontFamily:'var(--sans)', fontSize:13.5, color: filters.ntu.includes(o.val) ? 'var(--navy)' : 'var(--muted)', fontWeight: filters.ntu.includes(o.val) ? 500 : 300 }}>{o.label}</span>
          </label>
        ))}
      </div>
    </aside>
  );
}

/* ── Team card ── */
function TeamCard({ team, delay }) {
  const [ref, v] = useInView();
  const hasNtu = team.ntu && team.ntu !== '無' && team.ntu !== null;
  const ntuLabel = hasNtu ? team.ntu.replace('有，台大', '台大').replace('有，', '') : null;
  /* initials for logo placeholder */
  const initials = team.display_name.replace(/[『』「」【】《》〈〉]/g,'').slice(0,2);

  return (
    <div ref={ref} className="team-card" style={{
      opacity: v?1:0, transform: v?'none':'translateY(20px)',
      transition: `opacity 0.55s cubic-bezier(0.22,1,0.36,1) ${delay}ms, transform 0.55s cubic-bezier(0.22,1,0.36,1) ${delay}ms, box-shadow 0.25s, border-color 0.25s`,
      padding:'28px 24px 24px', display:'flex', flexDirection:'column', gap:0, borderRadius:6,
    }}>
      {/* Logo + stage badge row */}
      <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', marginBottom:16 }}>
        {/* Logo placeholder */}
        <div style={{ width:52, height:52, borderRadius:10, border:'1px solid var(--rule)', background:'var(--offwhite)', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
          {team.logo
            ? <img src={team.logo} alt={team.display_name} style={{ width:'100%', height:'100%', objectFit:'contain', borderRadius:10 }} />
            : <span style={{ fontFamily:'var(--serif)', fontSize:15, fontWeight:600, color:'var(--navy)', opacity:0.45, letterSpacing:'0.02em' }}>{initials}</span>
          }
        </div>
        {team.stage && (
          <span style={{ flexShrink:0, background:'rgba(0,216,200,0.12)', color:'#007A74', fontFamily:'var(--mono)', fontSize:9.5, letterSpacing:'0.1em', padding:'4px 10px', borderRadius:2, textTransform:'uppercase' }}>{team.stage}</span>
        )}
      </div>

      {/* Name */}
      <h3 style={{ fontFamily:'var(--serif)', fontSize:16, fontWeight:600, color:'var(--navy)', lineHeight:1.4, marginBottom:8 }}>
        {team.url
          ? <a href={team.url} target="_blank" rel="noopener noreferrer" style={{ display:'inline-flex', alignItems:'center', gap:5, color:'inherit' }}>
              {team.display_name}
              <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="var(--teal)" strokeWidth="1.6"><path d="M2 10L10 2M5 2h5v5"/></svg>
            </a>
          : team.display_name}
      </h3>

      {/* Description */}
      {team.desc && (
        <p style={{ fontFamily:'var(--sans)', fontSize:13, fontWeight:300, lineHeight:1.8, color:'var(--muted)', flex:1, marginBottom:16,
          display:'-webkit-box', WebkitLineClamp:3, WebkitBoxOrient:'vertical', overflow:'hidden' }}>
          {team.desc}
        </p>
      )}

      {/* Tags */}
      <div style={{ display:'flex', flexWrap:'wrap', gap:5, marginTop:'auto' }}>
        {ntuLabel && (
          <span style={{ background:'rgba(0,216,200,0.1)', color:'#007A74', fontFamily:'var(--sans)', fontSize:10.5, fontWeight:500, padding:'3px 9px', borderRadius:3 }}>{ntuLabel}</span>
        )}
        {(team.sectors||[]).map(s => (
          <span key={s} style={{ background:'var(--navy)', color:'rgba(255,255,255,0.8)', fontFamily:'var(--sans)', fontSize:10.5, padding:'3px 9px', borderRadius:3 }}>{s}</span>
        ))}
        {(team.bm||[]).map(b => (
          <span key={b} style={{ border:'1px solid var(--rule)', color:'var(--muted)', fontFamily:'var(--mono)', fontSize:9.5, letterSpacing:'0.04em', padding:'3px 9px', borderRadius:3 }}>{b}</span>
        ))}
      </div>
    </div>
  );
}

/* ── Main listing ── */
function TeamListing() {
  const isMobile = useIsMobile();
  const [query, setQuery] = useState('');
  const [filters, setFilters] = useState({ bm: [], ntu: [] });

  const filtered = useMemo(() => {
    const terms = query.toLowerCase().split(/[\n,，、\s]+/).map(s => s.trim()).filter(Boolean);
    return ALL_TEAMS.filter(t => {
      /* text search */
      if (terms.length) {
        const haystack = [t.display_name, t.desc, t.ntu, t.stage, ...(t.bm || []), ...(t.sectors || [])].filter(Boolean).join(' ').toLowerCase();
        const match = terms.some(q => haystack.includes(q));
        if (!match) return false;
      }
      /* BM filter */
      if (filters.bm.length > 0) {
        if (!filters.bm.some(f => t.bm.includes(f))) return false;
      }
      /* NTU filter */
      if (filters.ntu.length > 0) {
        const isNtu = t.ntu && t.ntu !== '無' && t.ntu !== null;
        if (filters.ntu.includes('無') && !filters.ntu.some(f => f !== '無')) {
          if (isNtu) return false;
        } else {
          const wantsNtu = filters.ntu.filter(f => f !== '無');
          const wantsNon = filters.ntu.includes('無');
          if (wantsNtu.length > 0 && !isNtu) return false;
          if (wantsNtu.length > 0 && isNtu) {
            const matches = wantsNtu.some(f => (t.ntu||'').includes(f));
            if (!matches && !wantsNon) return false;
          }
          if (wantsNon && !wantsNtu.length && isNtu) return false;
        }
      }
      return true;
    });
  }, [query, filters]);

  return (
    <>
      <Hero query={query} setQuery={setQuery} />
      <div id="team-results" style={{ maxWidth: 1280, margin:'0 auto', padding: isMobile ? '0' : '0 10%' }}>
        <div style={{ display:'flex', flexDirection: isMobile?'column':'row', gap: isMobile?0:40, alignItems:'flex-start', paddingTop: isMobile?0:12, paddingBottom:80 }}>
          <FilterSidebar filters={filters} setFilters={setFilters} total={ALL_TEAMS.length} filtered={filtered.length} />

          <div style={{ flex:1, minWidth:0 }}>
            {/* Result header */}
            <div style={{ padding: isMobile?'20px 6% 16px':'0 0 24px', display:'flex', alignItems:'center', justifyContent:'space-between' }}>
              <span style={{ fontFamily:'var(--mono)', fontSize:11, color:'var(--muted)' }}>
                {filtered.length === ALL_TEAMS.length ? `全部 ${ALL_TEAMS.length} 個團隊` : `${filtered.length} 個結果`}
              </span>
              {(query||filters.bm.length||filters.ntu.length) ? (
                <button onClick={() => { setQuery(''); setFilters({bm:[],ntu:[]}); }} style={{ fontFamily:'var(--mono)', fontSize:10, letterSpacing:'0.08em', color:'var(--mint)', background:'none', border:'none', cursor:'pointer' }}>清除所有篩選</button>
              ) : null}
            </div>

            {filtered.length === 0 ? (
              <div style={{ padding:'80px 6%', textAlign:'center', color:'var(--muted)', fontFamily:'var(--serif)', fontSize:16 }}>
                找不到符合條件的團隊，試試其他關鍵字。
              </div>
            ) : (
              <div style={{ display:'grid', gridTemplateColumns: isMobile?'1fr':'repeat(3, 1fr)', gap:16 }}>
                {filtered.map((team, i) => <TeamCard key={team.display_name} team={team} delay={(i%6)*40} />)}
              </div>
            )}

            <p style={{ fontFamily:'var(--mono)', fontSize:10, color:'var(--muted)', marginTop:20, textAlign:'center', padding: isMobile?'0 6%':0 }}>
              * 團隊資料依目前匯入名單顯示，後續可逐步補齊歷屆梯次與團隊 Logo。
            </p>
          </div>
        </div>
      </div>
    </>
  );
}

/* ── CTA ── */
function CTA() {
  const isMobile = useIsMobile();
  return (
    <section style={{ padding: isMobile?'0 6% 72px':'0 10% 120px', background:'var(--offwhite)' }}>
      <AnimUp>
        <div style={{ position:'relative', overflow:'hidden', background:'linear-gradient(130deg, rgba(7,18,38,0.9), rgba(26,46,74,0.96)), url(images/events/opening-2026-coaching.jpg) center/cover', borderRadius:4, border:'1px solid rgba(0,216,200,0.15)', padding: isMobile?'48px 28px':'64px 80px', display:'flex', flexDirection: isMobile?'column':'row', alignItems: isMobile?'flex-start':'center', justifyContent:'space-between', gap: isMobile?32:48 }}>
          <div style={{ position:'absolute', inset:0, opacity:0.3, background:'repeating-linear-gradient(0deg,transparent,transparent 72px,rgba(0,216,200,0.07) 72px,rgba(0,216,200,0.07) 73px),repeating-linear-gradient(90deg,transparent,transparent 72px,rgba(0,216,200,0.07) 72px,rgba(0,216,200,0.07) 73px)' }} />
          <div style={{ position:'relative', zIndex:1 }}>
            <div style={{ fontFamily:'var(--mono)', fontSize:11, letterSpacing:'0.18em', color:'var(--mint)', textTransform:'uppercase', marginBottom:14 }}>Get Involved</div>
            <h2 style={{ fontFamily:'var(--serif)', fontSize: isMobile?24:32, fontWeight:600, color:'#fff', lineHeight:1.35, marginBottom:10 }}>加入台大新創生態系</h2>
            <p style={{ fontFamily:'var(--sans)', fontSize:14, fontWeight:300, color:'rgba(255,255,255,0.7)', maxWidth:420 }}>不論是申請加速器、加入天使會，還是以企業身份合作，我們都有對應的方案。</p>
          </div>
          <div style={{ position:'relative', zIndex:1, flexShrink:0, display:'flex', flexDirection:'column', gap:12 }}>
            {[
              { label:'申請 2027 梯次', href:'apply.html' },
              { label:'加入台大天使會', href:'angels.html' },
              { label:'企業合作方案', href:'corporate-partners.html' },
            ].map((item,i) => (
              <a key={i} href={item.href} style={{ display:'inline-flex', alignItems:'center', justifyContent:'space-between', gap:16, padding:'12px 20px', background: i===0?'var(--mint)':'rgba(255,255,255,0.08)', color: i===0?'var(--navy)':'#fff', border: i===0?'none':'1px solid rgba(255,255,255,0.2)', fontFamily:'var(--sans)', fontSize:13.5, fontWeight: i===0?600:400, borderRadius:2, transition:'all 0.2s', minWidth:200 }}>
                {item.label}
                <svg width="14" height="10" viewBox="0 0 14 10" fill="none"><path d="M0 5h12M8 1l4 4-4 4" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/></svg>
              </a>
            ))}
          </div>
        </div>
      </AnimUp>
    </section>
  );
}

function Page() {
  const isMobile = useIsMobile();
  return (
    <div style={{ maxWidth:'100vw', overflowX:'hidden' }}>
      <SharedNav activeKey="最新動態" />
      <SharedSocialSidebar />
      <main style={{ paddingRight: isMobile?0:80 }}>
        <TeamListing />
        <CTA />
      </main>
      <div style={{ paddingRight: isMobile?0:80 }}>
        <SharedFooter />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
</body>
</html>
