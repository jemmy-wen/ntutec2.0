<script type="text/babel" src="shared.js?v=2"></script>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

function useInView(opts = {}) {
  const ref = useRef(null);
  const [v, setV] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setV(true); obs.disconnect(); } }, { threshold: opts.threshold || 0.12 });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return [ref, v];
}

function AnimUp({ children, delay = 0, style = {} }) {
  const [ref, v] = useInView();
  return <div ref={ref} style={{ opacity: v ? 1 : 0, transform: v ? 'none' : 'translateY(28px)', transition: `opacity 0.7s cubic-bezier(0.22,1,0.36,1) ${delay}ms, transform 0.7s cubic-bezier(0.22,1,0.36,1) ${delay}ms`, ...style }}>{children}</div>;
}

];

/* ── Hero ── */

      </svg>}
      {/* overlay */}
      <div style={{ position: isMobile ? 'relative' : 'absolute', inset: 0, background: 'linear-gradient(135deg, rgba(26,46,74,0.82) 0%, rgba(26,46,74,0.55) 100%)', zIndex: 1 }} />
      {/* content */}

        <p style={{ fontFamily: 'var(--sans)', fontWeight: 300, fontSize: isMobile ? 15 : 18, color: 'rgba(255,255,255,0.82)', maxWidth: 520, lineHeight: 1.7, marginBottom: 36, opacity: loaded ? 1 : 0, transition: 'opacity 0.6s 0.35s' }}>
          突破創新卡點，結合 13 年台大加速器 know-how 與產業實務，提供企業端對端的創新轉型解決方案。

      ) : (

      )}
    </section>
  );
}
