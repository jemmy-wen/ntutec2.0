<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design Kit — NTUTEC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #1A2E4A; --teal: #58A8A0; --mint: #00D8C8;
      --white: #FAFAF8; --offwhite: #F7F5F1; --rule: #E0E0DC;
      --text: #1A1A18; --muted: #6C727B;
      --serif: 'Noto Sans TC', sans-serif;
      --sans: 'DM Sans', 'Noto Sans TC', sans-serif;
      --mono: 'Space Mono', monospace;
    }
    html { scroll-behavior: smooth; }
    body { font-family: var(--sans); background: var(--offwhite); color: var(--text); }
    ::selection { background: var(--mint); color: var(--navy); }
    * { box-sizing: border-box; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

/* ── Swatch ── */
function Swatch({ token, hex, usage, dark }) {
  const [copied, setCopied] = useState(false);
  function copy() {
    navigator.clipboard.writeText(hex);
    setCopied(true);
    setTimeout(() => setCopied(false), 1200);
  }
  return (
    <div onClick={copy} style={{ cursor: 'pointer', borderRadius: 4, overflow: 'hidden', border: '1px solid var(--rule)' }}>
      <div style={{ background: hex, height: 80 }} />
      <div style={{ background: '#fff', padding: '12px 14px' }}>
        <div style={{ fontFamily: 'var(--mono)', fontSize: 11, fontWeight: 700, color: 'var(--navy)', marginBottom: 4 }}>{token}</div>
        <div style={{ fontFamily: 'var(--mono)', fontSize: 11, color: copied ? 'var(--teal)' : 'var(--muted)', marginBottom: 6 }}>{copied ? 'Copied!' : hex}</div>
        <div style={{ fontFamily: 'var(--sans)', fontSize: 12, fontWeight: 300, color: 'var(--muted)', lineHeight: 1.6 }}>{usage}</div>
      </div>
    </div>
  );
}

/* ── Section wrapper ── */
function Section({ title, label, children, bg = '#fff' }) {
  return (
    <section style={{ background: bg, padding: '72px 0', borderBottom: '1px solid var(--rule)' }}>
      <div style={{ maxWidth: 1200, margin: '0 auto', padding: '0 48px' }}>
        <div style={{ marginBottom: 48 }}>
          <div style={{ fontFamily: 'var(--mono)', fontSize: 11, fontWeight: 500, letterSpacing: '0.14em', color: 'var(--teal)', textTransform: 'uppercase', marginBottom: 10 }}>{label}</div>
          <h2 style={{ fontFamily: 'var(--serif)', fontSize: 34, fontWeight: 600, color: 'var(--navy)' }}>{title}</h2>
        </div>
        {children}
      </div>
    </section>
  );
}

/* ── Token row ── */
function TokenRow({ name, value, note }) {
  return (
    <div style={{ display: 'grid', gridTemplateColumns: '220px 1fr 1fr', gap: 16, padding: '14px 0', borderBottom: '1px solid var(--rule)', alignItems: 'center' }}>
      <code style={{ fontFamily: 'var(--mono)', fontSize: 12, color: 'var(--navy)', background: 'rgba(88,168,160,0.1)', padding: '2px 8px', borderRadius: 3 }}>{name}</code>
      <span style={{ fontFamily: 'var(--mono)', fontSize: 12, color: 'var(--muted)' }}>{value}</span>
      <span style={{ fontFamily: 'var(--sans)', fontSize: 13, fontWeight: 300, color: 'var(--muted)' }}>{note}</span>
    </div>
  );
}

/* ── Hatch pattern for wireframe image placeholders ── */
function HatchRect({ width = '100%', height = '100%', style = {} }) {
  const id = 'hatch-' + Math.random().toString(36).slice(2, 7);
  return (
    <svg width={width} height={height} style={{ display: 'block', ...style }}>
      <defs>
        <pattern id={id} patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
          <line x1="0" y1="0" x2="0" y2="10" stroke="#C8C8C4" strokeWidth="1" />
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill={`url(#${id})`} />
    </svg>
  );
}

/* ── Wireframe label pill ── */
function WFLabel({ children, color = 'var(--teal)', top, left, right, bottom, transform }) {
  return (
    <div style={{
      position: 'absolute', top, left, right, bottom, transform,
      background: color, color: '#fff',
      fontFamily: 'var(--mono)', fontSize: 9, fontWeight: 700,
      letterSpacing: '0.08em', textTransform: 'uppercase',
      padding: '3px 8px', borderRadius: 3, whiteSpace: 'nowrap', zIndex: 10,
      pointerEvents: 'none',
    }}>{children}</div>
  );
}

/* ── Rule 1: Stats 數據方塊 Wireframe ── */
function WFRule1() {
  return (
    <div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 16 }}>

        <div>
          <div style={{ fontFamily: 'var(--serif)', fontSize: 17, fontWeight: 600, color: 'var(--navy)', marginBottom: 2 }}>Stats 數據方塊</div>
          <div style={{ fontFamily: 'var(--sans)', fontSize: 12, fontWeight: 300, color: 'var(--muted)' }}>每頁 Hero 底部必須有一組數據卡，以負 margin 疊壓在下方 section 之上</div>
        </div>

      {/* Wireframe */}
      <div style={{ position: 'relative', background: '#fff', border: '1px solid var(--rule)', borderRadius: 6, overflow: 'visible', marginBottom: 16 }}>

          <div style={{ position: 'absolute', inset: 0, background: 'rgba(26,46,74,0.72)' }} />
          <WFLabel top={12} left={12}>Hero Section</WFLabel>
          {/* Nav bar hint */}
          <div style={{ position: 'absolute', top: 0, left: 0, right: 0, height: 28, background: 'rgba(26,46,74,0.5)', display: 'flex', alignItems: 'center', padding: '0 16px', gap: 8 }}>
            <div style={{ width: 36, height: 6, borderRadius: 2, background: 'rgba(255,255,255,0.4)' }} />
            <div style={{ flex: 1, display: 'flex', justifyContent: 'flex-end', gap: 6 }}>
              {[40,36,44,36].map((w,i) => <div key={i} style={{ width: w, height: 5, borderRadius: 2, background: 'rgba(255,255,255,0.25)' }} />)}
            </div>
          </div>
          {/* Hero title lines */}
          <div style={{ position: 'absolute', bottom: 36, left: 20, right: '40%' }}>
            <div style={{ height: 10, borderRadius: 2, background: 'rgba(255,255,255,0.7)', marginBottom: 8, width: '80%' }} />
            <div style={{ height: 7, borderRadius: 2, background: 'rgba(255,255,255,0.35)', width: '60%' }} />

        {/* Stats card — overlapping */}
        <div style={{
          position: 'absolute', bottom: -32, left: 24, right: 24,

          padding: '12px 20px', display: 'flex', gap: 0, zIndex: 5,
        }}>
          <WFLabel bottom='calc(100% + 6px)' left={0} color="var(--teal)">Stats 卡（absolute · bottom: 0 · z-index 10）</WFLabel>
          {[['13', '年', '深耕台大'], ['500+', '', '輔導新創'], ['74', '位', '年度投資人']].map(([n, u, l], i) => (
            <div key={i} style={{ flex: 1, paddingLeft: i > 0 ? 16 : 0, borderLeft: i > 0 ? '1px solid var(--rule)' : 'none', marginLeft: i > 0 ? 16 : 0 }}>
              <div style={{ fontFamily: 'var(--mono)', fontSize: 18, fontWeight: 600, color: 'var(--navy)', lineHeight: 1 }}>
                {n}<span style={{ fontSize: 10, color: 'var(--teal)', marginLeft: 1 }}>{u}</span>
              </div>
              <div style={{ fontFamily: 'var(--sans)', fontSize: 10, fontWeight: 300, color: 'var(--muted)', marginTop: 3 }}>{l}</div>
            </div>
          ))}
        </div>

        {/* Next section */}
        <div style={{ height: 60, background: 'var(--offwhite)', borderRadius: '0 0 6px 6px', paddingTop: 44, paddingLeft: 20 }}>
          <div style={{ fontFamily: 'var(--mono)', fontSize: 9, color: 'var(--muted)', letterSpacing: '0.08em' }}>NEXT SECTION（margin-top 需預留 Stats 卡高度）</div>
        </div>
      </div>

      {/* Annotation */}
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>

          { label: '手機', note: 'absolute 移除，Stats 卡以 inline flow 接在 Hero 正下方' },
        ].map((a, i) => (
          <div key={i} style={{ background: 'var(--offwhite)', borderRadius: 4, padding: '12px 14px', borderLeft: `3px solid ${i === 0 ? 'var(--teal)' : 'var(--muted)'}` }}>
            <div style={{ fontFamily: 'var(--mono)', fontSize: 10, fontWeight: 700, color: 'var(--navy)', marginBottom: 4 }}>{a.label}</div>
            <div style={{ fontFamily: 'var(--sans)', fontSize: 12, fontWeight: 300, color: 'var(--muted)', lineHeight: 1.7 }}>{a.note}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ── Rule 2: Hero SVG 切角 Wireframe ── */
function WFRule2() {
  return (
    <div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 16 }}>
        <div style={{ width: 28, height: 28, borderRadius: '50%', background: 'var(--navy)', color: 'var(--mint)', fontFamily: 'var(--mono)', fontSize: 12, fontWeight: 700, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>2</div>
        <div>
          <div style={{ fontFamily: 'var(--serif)', fontSize: 17, fontWeight: 600, color: 'var(--navy)', marginBottom: 2 }}>Hero 圖片 SVG 切角排版</div>
          <div style={{ fontFamily: 'var(--sans)', fontSize: 12, fontWeight: 300, color: 'var(--muted)' }}>Hero 圖片區塊以 clip-path hexagon 裁切，再用兩個 SVG 白色三角形製造切角錯覺</div>

      </div>

      {/* Wireframe */}
      <div style={{ position: 'relative', background: '#fff', border: '1px solid var(--rule)', borderRadius: 6, padding: 24, marginBottom: 16 }}>

          {/* Left: clip-path shape demo */}

            <div style={{ fontFamily: 'var(--mono)', fontSize: 9, color: 'var(--muted)', letterSpacing: '0.1em', textTransform: 'uppercase', marginBottom: 10 }}>整體圖片區塊 · clip-path</div>
            <div style={{ position: 'relative' }}>
              <svg viewBox="0 0 300 180" style={{ width: '100%', display: 'block' }}>
                {/* Page background */}
                <rect width="300" height="180" fill="#F7F5F1" />
                {/* Clip-path shape fill (image placeholder) */}
                <clipPath id="hero-clip">
                  <polygon points="0,40 81,0 300,0 300,140 219,180 0,180" />
                </clipPath>
                <g clipPath="url(#hero-clip)">
                  {/* Hatch fill */}
                  <defs>
                    <pattern id="h2" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
                      <line x1="0" y1="0" x2="0" y2="8" stroke="#B0CAC8" strokeWidth="0.8" />
                    </pattern>
                  </defs>
                  <rect width="300" height="180" fill="url(#h2)" />
                  <rect width="300" height="180" fill="rgba(26,46,74,0.55)" />
                </g>
                {/* clip-path outline */}
                <polygon points="0,40 81,0 300,0 300,140 219,180 0,180" fill="none" stroke="var(--teal)" strokeWidth="1.5" strokeDasharray="4 3" />
                {/* SVG white triangles */}
                <polygon points="0,0 81,0 0,40" fill="#F7F5F1" opacity="0.95" />
                <polygon points="300,180 219,180 300,140" fill="#F7F5F1" opacity="0.95" />
                {/* Labels */}
                <text x="8" y="13" fontFamily="monospace" fontSize="7" fill="var(--teal)" fontWeight="700">SVG △ 左上</text>
                <text x="185" y="176" fontFamily="monospace" fontSize="7" fill="var(--teal)" fontWeight="700">SVG △ 右下</text>
                <text x="110" y="88" fontFamily="monospace" fontSize="8" fill="rgba(255,255,255,0.9)" fontWeight="700" textAnchor="middle">IMAGE AREA</text>
                <text x="110" y="100" fontFamily="monospace" fontSize="6.5" fill="rgba(255,255,255,0.6)" textAnchor="middle">clip-path: polygon(…)</text>
              </svg>
            </div>
          </div>

          {/* Right: two-layer explanation */}
          <div>
            <div style={{ fontFamily: 'var(--mono)', fontSize: 9, color: 'var(--muted)', letterSpacing: '0.1em', textTransform: 'uppercase', marginBottom: 10 }}>兩層疊加原理</div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
              {[
                { n: 'L1', color: 'var(--navy)', label: 'clip-path 裁切整個 Hero 區塊', sub: 'polygon(0% 22%, 27% 0%, 100% 0%, 100% 78%, 73% 100%, 0% 100%)' },
                { n: 'L2', color: 'var(--teal)', label: 'SVG 白色三角形覆蓋兩角', sub: '左上角 + 右下角各一個，fill 色對應頁面底色（#F7F5F1 或 #FAFAF8）' },
              ].map((item, i) => (
                <div key={i} style={{ display: 'flex', gap: 12, padding: '14px', background: 'var(--offwhite)', borderRadius: 4, borderLeft: `3px solid ${item.color}` }}>
                  <div style={{ width: 22, height: 22, borderRadius: '50%', background: item.color, color: '#fff', fontFamily: 'var(--mono)', fontSize: 9, fontWeight: 700, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>{item.n}</div>
                  <div>
                    <div style={{ fontFamily: 'var(--sans)', fontSize: 12, fontWeight: 600, color: 'var(--navy)', marginBottom: 4 }}>{item.label}</div>
                    <code style={{ fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--muted)', lineHeight: 1.7, display: 'block' }}>{item.sub}</code>
                  </div>
                </div>
              ))}
              <div style={{ padding: '12px 14px', background: 'rgba(0,216,200,0.08)', borderRadius: 4, border: '1px solid rgba(0,216,200,0.3)' }}>
                <div style={{ fontFamily: 'var(--mono)', fontSize: 9, fontWeight: 700, color: 'var(--teal)', letterSpacing: '0.08em', marginBottom: 4 }}>手機降級</div>
                <div style={{ fontFamily: 'var(--sans)', fontSize: 12, fontWeight: 300, color: 'var(--muted)', lineHeight: 1.7 }}>clip-path 移除（isMobile ? 'none' : 'polygon(…)'）；SVG 三角形保留，自動縮放不影響排版</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

}

          </div>
        </div>

        {/* Banner */}
        <div style={{ background: 'var(--navy)', padding: '52px 28px 32px', position: 'relative' }}>
          <div style={{ fontFamily: 'var(--mono)', fontSize: 9, color: 'var(--teal)', letterSpacing: '0.1em', marginBottom: 10 }}>CTA BANNER · background: --navy</div>
          {/* dot grid decoration */}
          <div style={{ position: 'absolute', inset: 0, opacity: 0.07, backgroundImage: 'radial-gradient(circle, #fff 1px, transparent 1px)', backgroundSize: '18px 18px', pointerEvents: 'none' }} />

/* ── Page Architecture Tab ── */

  return (
    <div style={{ background: 'var(--offwhite)', minHeight: '100vh' }}>

        <div style={{ maxWidth: 1200, margin: '0 auto', padding: '0 48px' }}>

                {/* Hero with clip-path */}
                <defs>
                  <clipPath id="ov-clip"><polygon points="0,28 86,28 0,95" /><polygon points="320,392 234,392 320,325" /></clipPath>
                  <clipPath id="hero-ov">
