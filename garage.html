const { useState, useEffect, useRef } = React;

function useInView(opts = {}) {
  const ref = useRef(null);
  const [v, setV] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setV(true); obs.disconnect(); } }, { threshold: opts.threshold || 0.12 });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return [ref, v];
}

function AnimUp({ children, delay = 0, style = {} }) {
  const [ref, v] = useInView();
  return <div ref={ref} style={{ opacity: v ? 1 : 0, transform: v ? 'none' : 'translateY(28px)', transition: `opacity 0.7s cubic-bezier(0.22,1,0.36,1) ${delay}ms, transform 0.7s cubic-bezier(0.22,1,0.36,1) ${delay}ms`, ...style }}>{children}</div>;
}

          <span className="sec-en">Batch Schedule</span>
          <h2 style={{ display: 'inline-block' }}>
            <span className="sec-title-hl" style={{ fontSize: isMobile ? 28 : 36 }}>梯次時程</span>
          </h2>
        </AnimUp>
        <p style={{ fontFamily: 'var(--serif)', fontSize: 16, fontWeight: 300, lineHeight: 2, color: 'var(--muted)', marginBottom: 40 }}>車庫採年度梯次制，每年 3 月進駐至 12 月結束。2027 梯次預計 2026 年 12 月開放申請。</p>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 0 }}>
          {SCHEDULE.map((item, i) => (
            <AnimUp key={i} delay={i * 80}>
              <div style={{ display: 'flex', alignItems: 'flex-start', gap: 20, padding: '24px 0', borderTop: '1px solid var(--rule)' }}>
                <div style={{ width: 12, height: 12, borderRadius: '50%', background: item.active ? 'var(--teal)' : 'var(--rule)', flexShrink: 0, marginTop: 4 }} />
                <div>
                  <p style={{ fontFamily: 'var(--serif)', fontWeight: item.active ? 600 : 400, fontSize: 16, color: item.active ? 'var(--text)' : 'var(--muted)', marginBottom: 4 }}>{item.label}</p>
                  <p style={{ fontFamily: 'var(--sans)', fontSize: 13, color: 'var(--muted)' }}>{item.desc}</p>
                </div>
              </div>
            </AnimUp>
          ))}
          <div style={{ borderTop: '1px solid var(--rule)' }} />
        </div>
      </div>
    </section>
  );
}

function CTA() {
  const isMobile = useIsMobile();
  return (
    <section style={{ padding: isMobile ? '48px 6%' : '80px 10%', background: 'var(--offwhite)' }}>
      <div style={{ maxWidth: 1280, margin: '0 auto' }}>
        <AnimUp>
          <div style={{ background: 'var(--navy)', borderRadius: 4, padding: isMobile ? '48px 32px' : '72px 80px', display: 'flex', flexDirection: isMobile ? 'column' : 'row', alignItems: isMobile ? 'flex-start' : 'center', justifyContent: 'space-between', gap: 32 }}>
            <div>
              <span style={{ fontFamily: 'var(--mono)', fontSize: 11, fontWeight: 500, letterSpacing: '0.14em', color: 'var(--mint)', textTransform: 'uppercase', display: 'block', marginBottom: 16 }}>Apply</span>
              <h2 style={{ fontFamily: 'var(--serif)', fontSize: isMobile ? 26 : 34, fontWeight: 600, color: '#fff', lineHeight: 1.4, marginBottom: 16 }}>有興趣加入 2027 梯次？</h2>
              <p style={{ fontFamily: 'var(--sans)', fontSize: 15, fontWeight: 300, color: 'rgba(255,255,255,0.7)', lineHeight: 1.8, maxWidth: 480 }}>提前登記你的團隊，12 月正式申請開放時，我們將第一時間通知你。</p>
            </div>
            <a href="apply.html" style={{ display: 'inline-block', background: 'var(--mint)', color: 'var(--navy)', fontFamily: 'var(--serif)', fontWeight: 600, fontSize: 15, padding: '14px 32px', borderRadius: 2, whiteSpace: 'nowrap', flexShrink: 0 }}>預約 2027 梯次通知</a>
          </div>
        </AnimUp>
      </div>
    </section>
  );
}

function Page() {
  const isMobile = useIsMobile();
  return (
    <div style={{ maxWidth: '100vw', overflowX: 'hidden' }}>
      <SharedNav activeKey="輔導計畫" />
      <SharedSocialSidebar />
      <main style={{ paddingRight: isMobile ? 0 : 80 }}>
        <Hero />
        <Overview />
        <Benefits />
        <Eligibility />
        <AlumniSection />
        <BatchSchedule />
        <CTA />
      </main>
      <div style={{ paddingRight: isMobile ? 0 : 80 }}>
        <SharedFooter />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
</body>
</html>
