<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聯合活動 Co-hosted Events — 台大創創中心 NTUTEC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&family=Lato:wght@100;300;400;700;900" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide-react@0.474.0/dist/umd/lucide-react.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #1A2E4A; --teal: #58A8A0; --mint: #00D8C8;
      --white: #FAFAF8; --offwhite: #F7F5F1; --rule: #E0E0DC;
      --text: #1A1A18; --muted: #6C727B;
      --serif: 'Noto Sans TC', sans-serif;
      --mono: 'Lato', sans-serif;
      --sans: 'Lato', 'Noto Sans TC', sans-serif; --italic: 'Cormorant Garamond', Georgia, serif;
    }
    html { scroll-behavior: smooth; overflow-x: hidden; max-width: 100vw; }
    body { font-family: var(--sans); background: var(--offwhite); color: var(--text); overflow-x: hidden; max-width: 100vw; }
    a { color: inherit; text-decoration: none; }
    ::selection { background: var(--mint); color: var(--navy); }
    .sec-en { font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: 0.14em; color: var(--teal); text-transform: uppercase; display: block; margin-bottom: 12px; }
    .sec-title-hl {
      font-family: var(--serif); font-weight: 600; line-height: 1.4;
      color: var(--navy); display: inline;
      background: var(--mint);
      box-decoration-break: clone; -webkit-box-decoration-break: clone;
      padding: 4px 10px;
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="shared.js?v=2"></script>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

function useInView(opts = {}) {
  const ref = useRef(null);
  const [v, setV] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { setV(true); obs.disconnect(); }
    }, { threshold: opts.threshold || 0.12 });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return [ref, v];
}

function AnimUp({ children, delay = 0, style = {} }) {
  const [ref, v] = useInView();
  return (
    <div ref={ref} style={{
      opacity: v ? 1 : 0,
      transform: v ? 'none' : 'translateY(28px)',
      transition: `opacity 0.7s cubic-bezier(0.22,1,0.36,1) ${delay}ms, transform 0.7s cubic-bezier(0.22,1,0.36,1) ${delay}ms`,
      ...style,
    }}>{children}</div>
  );
}

/* ════ HERO ════ */
function Hero() {
  const [loaded, setLoaded] = useState(false);
  const isMobile = useIsMobile();
  useEffect(() => { const t = setTimeout(() => setLoaded(true), 80); return () => clearTimeout(t); }, []);

  return (
    <div style={{ position: 'relative' }}>
      <section style={{ position: 'relative', background: 'var(--offwhite)', overflow: 'hidden', minHeight: isMobile ? 480 : 640 }}>
        <div style={{ position: 'absolute', inset: 0 }}>
          <div style={{ position: 'absolute', inset: 0, background: 'var(--navy)' }} />
          <div style={{
            position: 'absolute', inset: 0,
            backgroundImage: 'url(images/events/opening-2026-group.jpg)',
            backgroundSize: 'cover', backgroundPosition: 'center 30%',
            opacity: 0.88,
          }} />
          <div style={{
            position: 'absolute', inset: 0,
            background: 'linear-gradient(to right, rgba(26,46,74,0.92) 0%, rgba(26,46,74,0.6) 55%, rgba(26,46,74,0.3) 100%)',
          }} />
        </div>

        <svg style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', pointerEvents: 'none', zIndex: 3 }}
          viewBox="0 0 1200 640" preserveAspectRatio="none">
          <polygon points="0,0 324,0 0,160" fill="#F7F5F1" />
          <polygon points="1200,640 876,640 1200,480" fill="#F7F5F1" />
        </svg>

        <div style={{ position: 'absolute', inset: 0, zIndex: 2, display: 'flex', alignItems: 'center' }}>
          <div style={{ width: '100%', maxWidth: 1280, margin: '0 auto', padding: isMobile ? '0 6%' : '0 10%' }}>
            <div style={{
              opacity: loaded ? 1 : 0, transform: loaded ? 'none' : 'translateY(20px)',
              transition: 'opacity 0.65s 0.1s, transform 0.65s 0.1s',
              fontFamily: 'var(--mono)', fontSize: 11, fontWeight: 500,
              letterSpacing: '0.18em', color: 'var(--mint)', textTransform: 'uppercase', marginBottom: 20,
            }}>Co-hosted Events</div>
            <h1 style={{
              opacity: loaded ? 1 : 0, transform: loaded ? 'none' : 'translateY(24px)',
              transition: 'opacity 0.65s 0.2s, transform 0.65s 0.2s',
              fontFamily: 'var(--serif)', fontSize: isMobile ? 40 : 64, fontWeight: 600,
              lineHeight: 1.15, color: '#fff', letterSpacing: '0.04em', marginBottom: 24,
            }}>聯合活動</h1>
            <p style={{
              opacity: loaded ? 1 : 0, transform: loaded ? 'none' : 'translateY(20px)',
              transition: 'opacity 0.65s 0.3s, transform 0.65s 0.3s',
              fontFamily: 'var(--sans)', fontSize: isMobile ? 15 : 17, fontWeight: 300,
              lineHeight: 1.9, color: 'rgba(255,255,255,0.84)', maxWidth: 480,
            }}>與產業夥伴攜手，打造高品質的創新交流場域。</p>
          </div>
        </div>
      </section>
    </div>
  );
}

/* ════ EVENT TYPES ════ */
const EVENT_TYPES = [
  { title: '產業論壇', body: '邀請業界領袖與學術專家，探討前沿趨勢與創新機會。', img: 'images/events/opening-2026-audience.jpg' },
  { title: 'Demo Day', body: '新創團隊公開展示成果，與企業及投資人面對面交流。', img: 'images/events/demo-day-2025-01.jpg' },
  { title: '工作坊', body: '主題式實作課程，涵蓋技術、商業模式與募資策略。', img: 'images/events/opening-2026-mentor-session.jpg' },
  { title: '交流媒合會', body: '促進新創團隊、企業與投資人之間的深度互動與合作機會。', img: 'images/events/opening-2026-networking.jpg' },
];

function EventTypes() {
  const isMobile = useIsMobile();
  return (
    <section style={{ padding: isMobile ? '72px 0' : '120px 0', background: '#fff' }}>
      <div style={{ maxWidth: 1280, margin: '0 auto', padding: isMobile ? '0 6%' : '0 10%' }}>
        <AnimUp>
          <div style={{ marginBottom: isMobile ? 40 : 64 }}>
            <span className="sec-en">Event Types</span>
            <h2 style={{ display: 'inline-block' }}>
              <span className="sec-title-hl" style={{ fontSize: isMobile ? 26 : 36 }}>活動類型</span>
            </h2>
          </div>
        </AnimUp>
        <div style={{ display: 'grid', gridTemplateColumns: isMobile ? '1fr' : 'repeat(2, 1fr)', gap: isMobile ? 28 : 40 }}>
          {EVENT_TYPES.map((item, i) => (
            <AnimUp key={i} delay={i * 80}>
              <div style={{ background: 'var(--offwhite)', borderLeft: '3px solid var(--mint)', overflow: 'hidden' }}>
                <div style={{ height: 200, overflow: 'hidden' }}>
                  <img src={item.img} alt={item.title} style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }} />
                </div>
                <div style={{ padding: isMobile ? '24px 24px' : '28px 32px' }}>
                  <h3 style={{ fontFamily: 'var(--serif)', fontSize: isMobile ? 17 : 20, fontWeight: 600, color: 'var(--navy)', marginBottom: 10, lineHeight: 1.4 }}>{item.title}</h3>
                  <p style={{ fontFamily: 'var(--sans)', fontSize: 14, fontWeight: 300, lineHeight: 1.9, color: 'var(--muted)' }}>{item.body}</p>
                </div>
              </div>
            </AnimUp>
          ))}
        </div>
      </div>
    </section>
  );
}

/* ════ FLAGSHIP EVENTS ════ */
const FLAGSHIP = [
  { title: '台大創新創業嘉年華', badge: '年度旗艦', body: '中心年度最大規模創新活動，匯聚新創、投資人、企業與學研各界，共同展示台灣創新能量。', img: 'images/events/opening-2026-biggroup.jpg' },
  { title: '台大天使會月例會', badge: '每月', body: '每月定期舉辦天使投資人例會，精選新創上台路演，推動早期投資媒合與社群交流。', img: 'images/events/opening-2026-pitching.jpg' },
  { title: 'Demo Day', badge: '每年 12 月', body: '加速器與車庫畢業團隊成果發表會，向創投與天使投資人集中展示，促進投資媒合。', img: 'images/events/demo-day-2025-group.jpg' },
  { title: '產業論壇與工作坊', badge: '不定期', body: '與企業夥伴共同舉辦產業論壇、技術工作坊，深化跨域知識交流與產學合作機會。', img: 'images/events/opening-2026-coaching.jpg' },
];

function FlagshipEvents() {
  const isMobile = useIsMobile();
  return (
    <section style={{ padding: isMobile ? '72px 0' : '120px 0', background: 'var(--offwhite)' }}>
      <div style={{ maxWidth: 1280, margin: '0 auto', padding: isMobile ? '0 6%' : '0 10%' }}>
        <AnimUp>
          <div style={{ marginBottom: isMobile ? 40 : 64 }}>
            <span className="sec-en">Flagship Events</span>
            <h2 style={{ display: 'inline-block' }}>
              <span className="sec-title-hl" style={{ fontSize: isMobile ? 26 : 36 }}>旗艦活動</span>
            </h2>
          </div>
        </AnimUp>
        {/* 第一個：全寬大橫幅，左圖右文 */}
        <AnimUp style={{ height: '100%', marginBottom: 24 }}>
          <div style={{ display: 'grid', gridTemplateColumns: isMobile ? '1fr' : '1fr 1fr', borderRadius: 4, overflow: 'hidden', border: '1px solid var(--rule)', background: '#fff', height: '100%' }}>
            <div style={{ height: isMobile ? 220 : 380, overflow: 'hidden' }}>
              <img src={FLAGSHIP[0].img} alt={FLAGSHIP[0].title} style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }} />
            </div>
            <div style={{ padding: isMobile ? '32px 28px' : '56px 56px', display: 'flex', flexDirection: 'column', justifyContent: 'center' }}>
              <div style={{ display: 'inline-flex', alignItems: 'center', background: 'rgba(0,216,200,0.12)', border: '1px solid var(--mint)', color: '#007A74', fontFamily: 'var(--mono)', fontSize: 11, fontWeight: 500, letterSpacing: '0.06em', padding: '4px 12px', borderRadius: 20, marginBottom: 20, alignSelf: 'flex-start' }}>{FLAGSHIP[0].badge}</div>
              <h3 style={{ fontFamily: 'var(--serif)', fontSize: isMobile ? 22 : 30, fontWeight: 600, color: 'var(--navy)', lineHeight: 1.35, marginBottom: 16 }}>{FLAGSHIP[0].title}</h3>
              <p style={{ fontFamily: 'var(--sans)', fontSize: 15, fontWeight: 300, lineHeight: 1.9, color: 'var(--muted)' }}>{FLAGSHIP[0].body}</p>
            </div>
          </div>
        </AnimUp>
        {/* 其餘 3 個：3 欄小卡片 */}
        <div style={{ display: 'grid', gridTemplateColumns: isMobile ? '1fr' : 'repeat(3, 1fr)', gap: 1, background: 'var(--rule)' }}>
          {FLAGSHIP.slice(1).map((ev, i) => (
            <AnimUp key={i} delay={i * 80} style={{ height: '100%' }}>
              <div style={{ background: '#fff', height: '100%', display: 'flex', flexDirection: 'column' }}>
                <div style={{ height: 180, overflow: 'hidden' }}>
                  <img src={ev.img} alt={ev.title} style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }} />
                </div>
                <div style={{ padding: isMobile ? '24px 24px' : '28px 32px', flex: 1 }}>
                  <div style={{ display: 'inline-flex', alignItems: 'center', background: 'rgba(0,216,200,0.12)', border: '1px solid var(--mint)', color: '#007A74', fontFamily: 'var(--mono)', fontSize: 10, fontWeight: 500, letterSpacing: '0.06em', padding: '3px 10px', borderRadius: 20, marginBottom: 14 }}>{ev.badge}</div>
                  <h3 style={{ fontFamily: 'var(--serif)', fontSize: isMobile ? 17 : 19, fontWeight: 600, color: 'var(--navy)', lineHeight: 1.4, marginBottom: 10 }}>{ev.title}</h3>
                  <p style={{ fontFamily: 'var(--sans)', fontSize: 13.5, fontWeight: 300, lineHeight: 1.85, color: 'var(--muted)' }}>{ev.body}</p>
                </div>
              </div>
            </AnimUp>
          ))}
        </div>
      </div>
    </section>
  );
}

/* ════ CTA ════ */
function CTA() {
  const isMobile = useIsMobile();
  return (
    <section style={{ padding: isMobile ? '0 6% 72px' : '0 10% 120px', maxWidth: 1280, margin: '0 auto' }}>
      <AnimUp>
        <div style={{
          position: 'relative', overflow: 'hidden', borderRadius: 4,
          background: 'linear-gradient(135deg, #0d1e36 0%, #1a3a52 100%)',
          padding: isMobile ? '48px 28px' : '64px 80px',
          display: 'flex', alignItems: isMobile ? 'flex-start' : 'center',
          justifyContent: 'space-between', flexDirection: isMobile ? 'column' : 'row', gap: isMobile ? 32 : 48,
        }}>
          <img src="images/events/opening-2026-01.jpg" alt="" aria-hidden="true" style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover', objectPosition: 'center', opacity: 0.15, pointerEvents: 'none' }} />
          <div style={{ position: 'absolute', inset: 0, opacity: 0.12, backgroundImage: 'radial-gradient(circle, rgba(0,216,200,0.6) 1px, transparent 1px)', backgroundSize: '44px 44px', pointerEvents: 'none' }} />
          <div style={{ position: 'absolute', top: 0, right: '30%', bottom: 0, width: 1, background: 'rgba(255,255,255,0.06)', pointerEvents: 'none' }} />
          <div style={{ position: 'relative', zIndex: 1 }}>
            <div style={{ fontFamily: 'var(--mono)', fontSize: 11, letterSpacing: '0.18em', color: 'var(--mint)', textTransform: 'uppercase', marginBottom: 14 }}>Corporate Partnership</div>
            <h2 style={{ fontFamily: 'var(--serif)', fontSize: isMobile ? 24 : 32, fontWeight: 600, color: '#fff', lineHeight: 1.35, marginBottom: 10 }}>有企業合作提案？歡迎與我們洽談。</h2>
            <p style={{ fontFamily: 'var(--sans)', fontSize: 14, fontWeight: 300, color: 'rgba(255,255,255,0.72)' }}>共同打造高品質的創新交流場域，擴大企業影響力。</p>
          </div>
          <div style={{ position: 'relative', zIndex: 1, flexShrink: 0 }}>
            <a href="corporate-partners.html" style={{
              display: 'inline-flex', alignItems: 'center',
              padding: '14px 28px', background: 'var(--mint)',
              fontFamily: 'var(--sans)', fontSize: 14, fontWeight: 600, color: 'var(--navy)',
              transition: 'background 0.2s',
            }}
            onMouseEnter={e => e.currentTarget.style.background = '#00bfb8'}
            onMouseLeave={e => e.currentTarget.style.background = 'var(--mint)'}>
              企業合作洽談 →
            </a>
          </div>
        </div>
      </AnimUp>
    </section>
  );
}

/* ════ PAGE ════ */
function Page() {
  const isMobile = useIsMobile();
  return (
    <div style={{ maxWidth: '100vw', overflowX: 'hidden' }}>
      <SharedNav activeKey="企業合作" />
      <SharedSocialSidebar />
      <Hero />
      <div style={{ maxWidth: 1440, margin: '0 auto', overflow: 'hidden', position: 'relative' }}>
        <main style={{ paddingRight: isMobile ? 0 : 80 }}>
          <EventTypes />
          <FlagshipEvents />
          <CTA />
        </main>
      </div>
      <div style={{ paddingRight: isMobile ? 0 : 80 }}>
        <SharedFooter />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
</body>
</html>
