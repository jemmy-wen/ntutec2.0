<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新創輔導計畫 Programs — 台大創創中心 NTUTEC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&family=Lato:wght@100;300;400;700;900" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide-react@0.474.0/dist/umd/lucide-react.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #1A2E4A; --teal: #58A8A0; --mint: #00D8C8;
      --white: #FAFAF8; --offwhite: #F7F5F1; --rule: #E0E0DC;
      --text: #1A1A18; --muted: #6C727B;
      --serif: 'Noto Sans TC', sans-serif; --mono: 'Lato', sans-serif; --sans: 'Lato', 'Noto Sans TC', sans-serif;
    }
    html { scroll-behavior: smooth; overflow-x: hidden; max-width: 100vw; }
    body { font-family: var(--sans); background: var(--offwhite); color: var(--text); overflow-x: hidden; max-width: 100vw; }
    a { color: inherit; text-decoration: none; }
    ::selection { background: var(--mint); color: var(--navy); }
    .sec-en { font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: 0.14em; color: var(--teal); text-transform: uppercase; display: block; margin-bottom: 12px; }
    .sec-title-hl { font-family: var(--serif); font-weight: 600; line-height: 1.4; color: var(--navy); display: inline; background: var(--mint); box-decoration-break: clone; -webkit-box-decoration-break: clone; padding: 4px 10px; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="shared.jsx?v=2"></script>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

function useInView(opts = {}) {
  const ref = useRef(null);
  const [v, setV] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setV(true); obs.disconnect(); } }, { threshold: opts.threshold || 0.12 });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return [ref, v];
}

function AnimUp({ children, delay = 0, style = {} }) {
  const [ref, v] = useInView();
  return <div ref={ref} style={{ opacity: v ? 1 : 0, transform: v ? 'none' : 'translateY(28px)', transition: `opacity 0.7s cubic-bezier(0.22,1,0.36,1) ${delay}ms, transform 0.7s cubic-bezier(0.22,1,0.36,1) ${delay}ms`, ...style }}>{children}</div>;
}

const PROGRAMS = [
  {
    label: '01', name: '台大車庫', en: 'NTU Garage',
    duration: '10 個月（3 月至 12 月）',
    target: '早期創業團隊（台大在校生、校友或教職員優先）',
    features: ['領域業師小組諮詢（4-5 隊同領域共學）', '免費虛擬進駐，會議室與活動場地使用', '3 大 Checkpoint：PSF / BMV / Traction 驗證', '銜接台大加速器的優先通道'],
    href: 'garage.html', cta: '了解台大車庫',
  },
  {
    label: '02', name: '台大加速器', en: 'NTU Accelerator',
    duration: '10 個月（3 月至 12 月）',
    target: '成長期新創（不限台大身分，有台大身分者優先）',
    features: ['陪跑業師每月一對一深度輔導', 'OKR Tracker 追蹤進度，每月 Office Hour 預約制', '企業資源對接與 Demo Day 募資路演', '150+ 投資人網絡，台大天使會媒合'],
    href: 'accelerator.html', cta: '了解台大加速器',
  },
];

const METHODOLOGY = [
  { label: '方法 01', title: 'OKR Tracker', desc: '所有輔導圍繞關鍵結果與進度狀態展開，每次會議前繳交報告，確保每個里程碑按節奏推進。' },
  { label: '方法 02', title: '業師診斷會', desc: '3 分鐘報告 + 12 分鐘業師追問 + 5 分鐘同儕分享，20 分鐘高強度診斷，精準找出盲點。' },
  { label: '方法 03', title: '三個關鍵審查節點', desc: 'Problem-Solution Fit → Business Model Validation → Traction，逐關遞進，確認每個階段的核心假設。' },
];

const COACHING = [
  { badge: '台大車庫', title: '輔導經理陪跑', desc: '專任輔導經理全程陪跑，每月定期 check-in，協助 MVP 驗證與用戶訪談，確保里程碑按節奏推進。' },
  { badge: '台大加速器', title: '業師 1-on-1 諮詢', desc: '配對 20+ 位具 Yahoo、TSMC、微軟、BCG 背景業師，依需求安排一對一深度諮詢，精準解決成長瓶頸。' },
  { badge: '企業垂直加速器', title: '企業場域驗證', desc: '媒合大企業提供真實市場驗證場域，企業 PM 共同推動專案，協助新創跨越死亡之谷、加速商模落地。' },
];

const TIMELINE_ITEMS = [
  { period: '2026 年 12 月 ~ 2027 年 1 月', label: '開放申請', desc: '線上提交報名表' },
  { period: '2027 年 2 月', label: '公布結果', desc: '入選團隊名單公告' },
  { period: '3–12 月', label: '輔導進行', desc: '業師諮詢 + Checkpoint 驗證' },
  { period: '12 月', label: 'Demo Day', desc: '向投資人路演，完成畢業' },
];

function Hero() {
  const [loaded, setLoaded] = useState(false);
  const isMobile = useIsMobile();
  useEffect(() => { const t = setTimeout(() => setLoaded(true), 80); return () => clearTimeout(t); }, []);

  return (
    <div style={{ position: 'relative' }}>
      <section style={{ position: 'relative', background: 'var(--offwhite)', overflow: 'hidden', minHeight: isMobile ? 480 : 720 }}>
        <div style={{ position: 'absolute', inset: 0, clipPath: isMobile ? 'none' : 'polygon(0% 22%, 27% 0%, 100% 0%, 100% 78%, 73% 100%, 0% 100%)' }}>
          <div style={{ position: 'absolute', inset: 0, background: 'var(--navy)' }} />
          <div style={{ position: 'absolute', inset: 0, backgroundImage: 'url(ntutec-design-handoff/public/images/events/opening-2026-biggroup.jpg)', backgroundSize: 'cover', backgroundPosition: '50% 30%', backgroundRepeat: 'no-repeat', opacity: 0.78 }} />
          <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(to top right, rgba(26,46,74,0.90) 0%, rgba(88,168,160,0.50) 35%, transparent 70%)' }} />
        </div>
        <svg style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', pointerEvents: 'none', zIndex: 3 }} viewBox="0 0 1200 720" preserveAspectRatio="none">
          <polygon points="0,0 324,0 0,160" fill="#F7F5F1" />
          <polygon points="1200,720 876,720 1200,560" fill="#F7F5F1" />
        </svg>
        <div style={{ position: 'relative', zIndex: 2, maxWidth: 1280, margin: '0 auto', padding: isMobile ? '100px 6% 56px' : '188px 10% 120px' }}>
          <div style={{ opacity: loaded ? 1 : 0, transition: 'opacity 0.65s 0.1s', fontFamily: 'var(--mono)', fontSize: 11, letterSpacing: '0.18em', color: 'var(--mint)', textTransform: 'uppercase', marginBottom: 24 }}>Programs</div>
          <h1 style={{ opacity: loaded ? 1 : 0, transition: 'opacity 0.65s 0.2s', fontFamily: 'var(--sans)', fontSize: isMobile ? 36 : 58, fontWeight: 600, lineHeight: 1.12, color: '#fff', marginBottom: 28 }}>新創輔導計畫</h1>
          <p style={{ opacity: loaded ? 1 : 0, transition: 'opacity 0.65s 0.3s', fontFamily: 'var(--serif)', fontSize: isMobile ? 15 : 16, fontWeight: 300, lineHeight: 2.05, color: 'rgba(255,255,255,0.84)', maxWidth: 520 }}>依據新創團隊的不同階段，提供最適合的輔導資源與成長路徑。</p>
        </div>
      </section>
    </div>
  );
}

function TwoPrograms() {
  const isMobile = useIsMobile();
  return (
    <>
      {PROGRAMS.map((p, i) => (
        <section key={i} style={{ padding: isMobile ? '72px 0' : '100px 0', background: i % 2 === 0 ? '#fff' : 'var(--offwhite)' }}>
          <div style={{ maxWidth: 1280, margin: '0 auto', padding: isMobile ? '0 6%' : '0 10%' }}>
            <div style={{ display: 'grid', gridTemplateColumns: isMobile ? '1fr' : '1fr 1fr', gap: isMobile ? 48 : 80 }}>
              <AnimUp style={{ order: isMobile ? undefined : (i % 2 === 1 ? 2 : 1) }}>
                <span className="sec-en">{p.en}</span>
                <div style={{ fontFamily: 'var(--mono)', fontSize: 64, fontWeight: 700, color: 'var(--rule)', lineHeight: 1, marginBottom: 12 }}>{p.label}</div>
                <h2 style={{ display: 'inline-block', marginBottom: 24 }}>
                  <span className="sec-title-hl" style={{ fontSize: isMobile ? 28 : 36 }}>{p.name}</span>
                </h2>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 10, marginTop: 24 }}>
                  <div style={{ display: 'flex', gap: 12 }}>
                    <span style={{ fontFamily: 'var(--sans)', fontSize: 14, fontWeight: 600, color: 'var(--text)', whiteSpace: 'nowrap' }}>期程</span>
                    <span style={{ fontFamily: 'var(--serif)', fontSize: 14, fontWeight: 300, color: 'var(--muted)' }}>{p.duration}</span>
                  </div>
                  <div style={{ display: 'flex', gap: 12 }}>
                    <span style={{ fontFamily: 'var(--sans)', fontSize: 14, fontWeight: 600, color: 'var(--text)', whiteSpace: 'nowrap' }}>對象</span>
                    <span style={{ fontFamily: 'var(--serif)', fontSize: 14, fontWeight: 300, color: 'var(--muted)' }}>{p.target}</span>
                  </div>
                </div>
              </AnimUp>
              <AnimUp delay={120} style={{ order: isMobile ? undefined : (i % 2 === 1 ? 1 : 2) }}>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 16, marginBottom: 32 }}>
                  {p.features.map((f, fi) => (
                    <div key={fi} style={{ display: 'flex', alignItems: 'flex-start', gap: 16 }}>
                      <div style={{ width: 24, height: 1, background: 'var(--teal)', flexShrink: 0, marginTop: 10 }} />
                      <p style={{ fontFamily: 'var(--serif)', fontSize: 15, fontWeight: 300, lineHeight: 1.85, color: 'var(--muted)' }}>{f}</p>
                    </div>
                  ))}
                </div>
                <a href={p.href} style={{ display: 'inline-block', background: 'transparent', color: 'var(--navy)', fontFamily: 'var(--serif)', fontWeight: 600, fontSize: 14, padding: '12px 24px', borderRadius: 2, border: '1px solid var(--rule)' }}>{p.cta} →</a>
              </AnimUp>
            </div>
          </div>
        </section>
      ))}
    </>
  );
}

function Methodology() {
  const isMobile = useIsMobile();
  return (
    <section style={{ padding: isMobile ? '72px 0' : '120px 0', background: 'var(--navy)' }}>
      <div style={{ maxWidth: 1280, margin: '0 auto', padding: isMobile ? '0 6%' : '0 10%' }}>
        <AnimUp style={{ marginBottom: isMobile ? 36 : 56 }}>
          <span className="sec-en" style={{ color: 'rgba(255,255,255,0.5)' }}>Methodology</span>
          <h2 style={{ display: 'inline-block' }}>
            <span style={{ fontFamily: 'var(--serif)', fontWeight: 600, lineHeight: 1.4, color: '#fff', display: 'inline', background: 'var(--teal)', boxDecorationBreak: 'clone', WebkitBoxDecorationBreak: 'clone', padding: '4px 10px', fontSize: isMobile ? 28 : 36 }}>輔導框架</span>
          </h2>
        </AnimUp>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 0 }}>
          {METHODOLOGY.map((m, i) => (
            <AnimUp key={i} delay={i * 80}>
              <div style={{ display: 'grid', gridTemplateColumns: isMobile ? '1fr' : '1fr 2fr', gap: 32, padding: '36px 0', borderTop: '1px solid rgba(255,255,255,0.1)' }}>
                <div>
                  <p style={{ fontFamily: 'var(--mono)', fontSize: 10, letterSpacing: '0.16em', color: 'rgba(255,255,255,0.4)', textTransform: 'uppercase', marginBottom: 10 }}>{m.label}</p>
                  <h3 style={{ fontFamily: 'var(--serif)', fontSize: 20, fontWeight: 600, color: '#fff' }}>{m.title}</h3>
                </div>
                <p style={{ fontFamily: 'var(--serif)', fontSize: 15, fontWeight: 300, lineHeight: 1.95, color: 'rgba(255,255,255,0.65)', paddingTop: isMobile ? 0 : 6 }}>{m.desc}</p>
              </div>
            </AnimUp>
          ))}
          <div style={{ borderTop: '1px solid rgba(255,255,255,0.1)' }} />
        </div>
      </div>
    </section>
  );
}

function CoachingMechanisms() {
  const isMobile = useIsMobile();
  return (
    <section style={{ padding: isMobile ? '72px 0' : '120px 0', background: '#fff' }}>
      <div style={{ maxWidth: 1280, margin: '0 auto', padding: isMobile ? '0 6%' : '0 10%' }}>
        <AnimUp style={{ marginBottom: isMobile ? 36 : 56, textAlign: isMobile ? 'left' : 'right' }}>
          <span className="sec-en" style={{ justifyContent: isMobile ? 'flex-start' : 'flex-end', display: 'flex' }}>Coaching Mechanism</span>
          <h2 style={{ display: 'inline-block' }}>
            <span className="sec-title-hl" style={{ fontSize: isMobile ? 28 : 36 }}>如何輔導你的新創？</span>
          </h2>
        </AnimUp>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 0 }}>
          {COACHING.map((m, i) => (
            <AnimUp key={i} delay={i * 80}>
              <div style={{ display: 'grid', gridTemplateColumns: isMobile ? '1fr' : '1fr 2fr', gap: 32, padding: '36px 0', borderTop: '1px solid var(--rule)' }}>
                <div>
                  <span style={{ display: 'inline-block', background: 'rgba(88,168,160,0.1)', color: 'var(--teal)', fontFamily: 'var(--sans)', fontSize: 12, fontWeight: 500, padding: '3px 12px', borderRadius: 12, marginBottom: 12 }}>{m.badge}</span>
                  <h3 style={{ fontFamily: 'var(--serif)', fontSize: 20, fontWeight: 600, color: 'var(--navy)' }}>{m.title}</h3>
                </div>
                <p style={{ fontFamily: 'var(--serif)', fontSize: 15, fontWeight: 300, lineHeight: 1.95, color: 'var(--muted)', paddingTop: isMobile ? 0 : 6 }}>{m.desc}</p>
              </div>
            </AnimUp>
          ))}
          <div style={{ borderTop: '1px solid var(--rule)' }} />
        </div>
      </div>
    </section>
  );
}

function AppTimeline() {
  const isMobile = useIsMobile();
  return (
    <section style={{ padding: isMobile ? '72px 0' : '120px 0', background: 'var(--offwhite)' }}>
      <div style={{ maxWidth: 1280, margin: '0 auto', padding: isMobile ? '0 6%' : '0 10%' }}>
        <AnimUp style={{ marginBottom: isMobile ? 36 : 56, textAlign: 'center' }}>
          <span className="sec-en" style={{ justifyContent: 'center', display: 'flex' }}>Application Timeline</span>
          <h2 style={{ display: 'inline-block' }}>
            <span className="sec-title-hl" style={{ fontSize: isMobile ? 28 : 36 }}>申請時程</span>
          </h2>
          <p style={{ fontFamily: 'var(--serif)', fontSize: 15, fontWeight: 300, color: 'var(--muted)', marginTop: 16 }}>計畫為期十個月（3 月至 12 月），申請期另計</p>
        </AnimUp>
        <div style={{ display: 'grid', gridTemplateColumns: isMobile ? 'repeat(2, 1fr)' : 'repeat(4, 1fr)', gap: 1, background: 'var(--rule)' }}>
          {TIMELINE_ITEMS.map((t, i) => (
            <AnimUp key={i} delay={i * 80}>
              <div style={{ background: '#fff', padding: isMobile ? '24px 16px' : '40px 28px', textAlign: 'center' }}>
                <p style={{ fontFamily: 'var(--mono)', fontSize: 10, fontWeight: 600, color: 'var(--teal)', marginBottom: 16, lineHeight: 1.5 }}>{t.period}</p>
                <h4 style={{ fontFamily: 'var(--serif)', fontSize: 18, fontWeight: 600, color: 'var(--navy)', marginBottom: 8 }}>{t.label}</h4>
                <p style={{ fontFamily: 'var(--sans)', fontSize: 12, color: 'var(--muted)' }}>{t.desc}</p>
              </div>
            </AnimUp>
          ))}
        </div>
      </div>
    </section>
  );
}

function CTA() {
  const isMobile = useIsMobile();
  return (
    <section style={{ padding: isMobile ? '48px 6%' : '80px 10%', background: 'var(--offwhite)' }}>
      <div style={{ maxWidth: 1280, margin: '0 auto' }}>
        <AnimUp>
          <div style={{ background: 'var(--navy)', borderRadius: 4, padding: isMobile ? '48px 32px' : '72px 80px', textAlign: 'center' }}>
            <h2 style={{ fontFamily: 'var(--serif)', fontSize: isMobile ? 26 : 34, fontWeight: 600, color: '#fff', marginBottom: 16 }}>不確定適合哪個計畫？</h2>
            <p style={{ fontFamily: 'var(--sans)', fontSize: 15, fontWeight: 300, color: 'rgba(255,255,255,0.7)', lineHeight: 1.8, maxWidth: 400, margin: '0 auto 32px' }}>查看常見問題，或直接與我們聯繫，讓我們協助你找到最適合的成長路徑。</p>
            <div style={{ display: 'flex', justifyContent: 'center', gap: 16, flexWrap: 'wrap' }}>
              <a href="faq.html" style={{ display: 'inline-block', background: 'transparent', color: 'rgba(255,255,255,0.7)', fontFamily: 'var(--serif)', fontSize: 15, padding: '14px 32px', borderRadius: 2, border: '1px solid rgba(255,255,255,0.2)' }}>查看常見問題</a>
              <a href="apply.html" style={{ display: 'inline-block', background: 'var(--mint)', color: 'var(--navy)', fontFamily: 'var(--serif)', fontWeight: 600, fontSize: 15, padding: '14px 32px', borderRadius: 2 }}>提前登記</a>
            </div>
          </div>
        </AnimUp>
      </div>
    </section>
  );
}

function Page() {
  const isMobile = useIsMobile();
  return (
    <div style={{ maxWidth: '100vw', overflowX: 'hidden' }}>
      <SharedNav activeKey="輔導計畫" />
      <SharedSocialSidebar />
      <main style={{ paddingRight: isMobile ? 0 : 80 }}>
        <Hero />
        <TwoPrograms />
        <Methodology />
        <CoachingMechanisms />
        <AppTimeline />
        <CTA />
      </main>
      <div style={{ paddingRight: isMobile ? 0 : 80 }}>
        <SharedFooter />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
</body>
</html>
