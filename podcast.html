const { useState, useEffect, useRef } = React;

function useInView(opts = {}) {
  const ref = useRef(null);
  const [v, setV] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { setV(true); obs.disconnect(); }
    }, { threshold: opts.threshold || 0.12 });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return [ref, v];
}

function AnimUp({ children, delay = 0, style = {} }) {
  const [ref, v] = useInView();
  return (
    <div ref={ref} style={{
      opacity: v ? 1 : 0,
      transform: v ? 'none' : 'translateY(28px)',
      transition: `opacity 0.7s cubic-bezier(0.22,1,0.36,1) ${delay}ms, transform 0.7s cubic-bezier(0.22,1,0.36,1) ${delay}ms`,
      ...style,
    }}>{children}</div>
  );
}

function EpisodeCard({ ep, delay }) {
  const [hovered, setHovered] = useState(false);
  const inner = (

        cursor: ep.link ? 'pointer' : 'default',

        <span style={{ width: 3, height: 3, borderRadius: '50%', background: 'var(--rule)', flexShrink: 0 }} />

        color: 'var(--navy)', lineHeight: 1.5, marginBottom: 10, flex: 1,
      }}>{ep.title}</h3>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginTop: 4 }}>
        <p style={{ fontFamily: 'var(--sans)', fontSize: 13, fontWeight: 300, color: 'var(--muted)' }}>{ep.guest}</p>
        {ep.link && (

          </svg>
        )}

    </div>
  );

  return (
    <AnimUp delay={delay} style={{ height: '100%' }}>
      {ep.link ? (
        <a href={ep.link} target="_blank" rel="noopener" style={{ display: 'block', height: '100%' }}>{inner}</a>

    </AnimUp>
  );
}
