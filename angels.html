function useInView(opts = {}) {
  const ref = useRef(null);
  const [v, setV] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setV(true); obs.disconnect(); } }, { threshold: opts.threshold || 0.12, rootMargin: opts.rootMargin || '0px' });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return [ref, v];
}

function AnimUp({ children, delay = 0, style = {} }) {
  const [ref, v] = useInView();
  return <div ref={ref} style={{ opacity: v ? 1 : 0, transform: v ? 'none' : 'translateY(28px)', transition: `opacity 0.7s cubic-bezier(0.22,1,0.36,1) ${delay}ms, transform 0.7s cubic-bezier(0.22,1,0.36,1) ${delay}ms`, ...style }}>{children}</div>;
}

            onMouseLeave={e => e.currentTarget.style.background='var(--mint)'}>
              立即申請加入 →
            </a>
            <a href="#membership" style={{
              display: 'inline-flex', alignItems: 'center',
              padding: '14px 28px', border: '1px solid rgba(255,255,255,0.5)',
              fontFamily: 'var(--sans)', fontSize: 14.5, color: '#fff',
              transition: 'border-color 0.2s, background 0.2s',
            }}
            onMouseEnter={e => { e.currentTarget.style.borderColor='#fff'; e.currentTarget.style.background='rgba(255,255,255,0.1)'; }}
            onMouseLeave={e => { e.currentTarget.style.borderColor='rgba(255,255,255,0.5)'; e.currentTarget.style.background='transparent'; }}>
              查看方案
            </a>
          </div>
        </div>
      </AnimUp>
    </section>
  );
}
