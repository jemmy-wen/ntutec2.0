<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>常見問題 FAQ — 台大創創中心 NTUTEC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&family=Lato:wght@100;300;400;700;900" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide-react@0.474.0/dist/umd/lucide-react.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #1A2E4A; --teal: #58A8A0; --mint: #00D8C8;
      --white: #FAFAF8; --offwhite: #F7F5F1; --rule: #E0E0DC;
      --text: #1A1A18; --muted: #6C727B;
      --serif: 'Noto Sans TC', sans-serif; --mono: 'Lato', sans-serif; --sans: 'Lato', 'Noto Sans TC', sans-serif; --italic: 'Cormorant Garamond', Georgia, serif;
    }
    html { scroll-behavior: smooth; overflow-x: hidden; max-width: 100vw; }
    body { font-family: var(--sans); background: var(--offwhite); color: var(--text); overflow-x: hidden; max-width: 100vw; }
    a { color: inherit; text-decoration: none; }
    ::selection { background: var(--mint); color: var(--navy); }
    .sec-en { font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: 0.14em; color: var(--teal); text-transform: uppercase; display: block; margin-bottom: 12px; }
    .sec-title-hl { font-family: var(--serif); font-weight: 600; line-height: 1.4; color: var(--navy); display: inline; background: var(--mint); box-decoration-break: clone; -webkit-box-decoration-break: clone; padding: 4px 10px; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="shared.js?v=2"></script>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

function useInView(opts = {}) {
  const ref = useRef(null);
  const [v, setV] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setV(true); obs.disconnect(); } }, { threshold: opts.threshold || 0.12 });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return [ref, v];
}

function AnimUp({ children, delay = 0, style = {} }) {
  const [ref, v] = useInView();
  return <div ref={ref} style={{ opacity: v ? 1 : 0, transform: v ? 'none' : 'translateY(28px)', transition: `opacity 0.7s cubic-bezier(0.22,1,0.36,1) ${delay}ms, transform 0.7s cubic-bezier(0.22,1,0.36,1) ${delay}ms`, ...style }}>{children}</div>;
}

const FAQS = [
  { category: '計畫相關', question: '台大加速器和台大車庫有什麼差別？', answer: '台大加速器適合已有 MVP 或初期營收的成長期新創，為期十個月（3月至12月），提供深度業師一對一輔導、企業資源對接與募資機會，不限台大身分。台大車庫適合概念驗證至 MVP 階段的早期團隊，提供免費虛擬進駐與社群支持，以台大身分優先，特殊情況可個案評估。' },
  { category: '計畫相關', question: '計畫需要支付費用或出讓股權嗎？', answer: '台大車庫與台大加速器均為完全免費計畫，不收取任何費用，也不要求股權。台大創創中心以促進台大創業生態系為使命，不以營利為目的。' },
  { category: '計畫相關', question: '計畫為期多久？每年招募幾梯？', answer: '台大加速器與台大車庫均為每年一梯，計畫時間為 3 月至 12 月，共十個月。申請通常在每年 12 月至隔年 2 月開放，入選結果約 2 月底公布。' },
  { category: '計畫相關', question: '計畫期間需要全程進駐嗎？', answer: '不需要全程駐點。台大車庫與台大加速器均採虛擬進駐模式，不提供固定座位，也不要求每日出勤。學員以參加定期輔導會議與中心活動為主，另可依需求預約使用中心會議室與活動場地。' },
  { category: '計畫相關', question: '計畫結束後還能獲得什麼支持？', answer: '畢業團隊可持續參與中心的校友網絡活動、業師諮詢，以及台大天使會的募資機會。台大車庫畢業團隊享有台大加速器的優先申請資格。' },
  { category: '計畫相關', question: '什麼是企業垂直加速器？和一般加速器有何不同？', answer: '企業垂直加速器是台大創創中心與各大企業夥伴合作的專項加速計畫，累計已舉辦逾 27 期。由企業提出真實業務需求，新創團隊以解決方案回應，成功者可獲企業資源挹注、場域驗證或合作機會。' },
  { category: '計畫相關', question: '計畫聚焦哪些產業領域？', answer: '台大創創中心 2026 年四大聚焦領域為：AI 軟體（企業 AI、SaaS、資料基礎設施）、生技醫療（AI 診斷、精準醫療、醫材）、硬科技（半導體、先進製造、機器人、顯示技術）、創新商模（ESG、循環經濟、FinTech、社會創新）。' },
  { category: '申請相關', question: '申請需要準備哪些資料？', answer: '基本申請資料包括：團隊介紹（成員背景與分工）、產品或服務說明、目標市場與商業模式、目前進度與未來規劃。台大加速器申請建議附上 Pitch Deck。' },
  { category: '申請相關', question: '非台大背景的團隊可以申請嗎？', answer: '台大加速器完全開放，不限台大身分，任何具備技術或商模創新的團隊均可申請。台大車庫以台大在校生、校友或教職員組成的團隊為主，外部團隊可個案評估。' },
  { category: '申請相關', question: '申請之後，審核流程是什麼？', answer: '申請流程分四步：線上申請 → 書面審查 → 面試邀約（通過書審者） → 結果通知（面試後三週內）。' },
  { category: '申請相關', question: '每年入選幾個團隊？', answer: '台大車庫每年約錄取 20 個團隊，台大加速器每年約錄取 20 個團隊，合計每梯次約 40 支新創。名額有限，以確保每個團隊都能獲得充分的輔導資源。' },
  { category: '申請相關', question: '學生團隊可以在課業期間參加嗎？', answer: '可以。許多入選團隊成員仍在就讀中。計畫設計上具彈性，輔導會議與活動以不嚴重影響課業為原則。' },
  { category: '申請相關', question: '落選了可以再次申請嗎？', answer: '可以。落選並不影響後續梯次的申請資格。中心建議落選團隊關注書面回饋（若有提供）、持續推進產品進度後，在下一梯次重新提交申請。' },
  { category: '台大天使會', question: '什麼是 NTUTEC ANGELS 台大天使會？', answer: 'NTUTEC ANGELS 是台大創創中心於 2023 年成立的天使投資社群，匯聚 40+ 位天使會員（150+ 投資人網絡），每月定期舉辦天使例會，提供會員經過三段嚴格篩選的優質早期案源。' },
  { category: '台大天使會', question: '如何成為天使會會員？', answer: '有意加入者可透過官網填寫入會諮詢表單，或直接聯繫投資經理。中心將安排一對一諮詢，說明入會條件、年費結構與會員權益。台大天使會以質量為優先，名額有限。' },
  { category: '台大天使會', question: '案件如何篩選？投資人能看到哪些資訊？', answer: '所有案件由投資經理逐一審閱，經初篩、面談評估後，撰寫完整盡調報告（市場分析、競爭格局、投資建議）。通過的案件上架月例會，會員可在專屬平台查閱六張資訊卡片與完整評估報告。' },
  { category: '台大天使會', question: '天使例會多久舉辦一次？', answer: '天使例會每月定期舉辦，由新創團隊進行 Pitch 與 Q&A。會員以個人資金直接投資，不受機構共投限制。' },
  { category: '台大天使會', question: '新創團隊要如何接觸台大天使會？', answer: '新創團隊可隨時透過官網投遞表單申請接觸台大天使會，無需事先參加台大加速器或台大車庫計畫。曾參與台大輔導計畫的校友團隊享有優先推薦資格。' },
  { category: '企業合作', question: '企業如何與台大創創中心合作？', answer: '合作模式包括：企業垂直加速器（出題共創）、聯合活動（Demo Day、黑客松、論壇）、案源媒合（優先接觸特定領域新創）、諮詢服務（創新策略、開放式創新顧問）。' },
  { category: '企業合作', question: '企業垂直加速器是什麼？如何參與？', answer: '企業垂直加速器由企業提出具體創新需求，中心負責召募並輔導對應的新創解題。合作企業可獲得優先技術接觸、共同開發機會，甚至投資或採購優先權。' },
  { category: '企業合作', question: '諮詢服務的內容是什麼？', answer: '中心提供企業創新策略諮詢，涵蓋開放式創新規劃、新創生態系建構、內部創業（Intrapreneurship）與 CVC（企業創投）策略。' },
  { category: '業師與輔導', question: '業師如何輔導新創？頻率是？', answer: '中心配對業師與入選新創進行每月一對一深度輔導，聚焦商業策略、市場進入、技術驗證或募資準備。業師均具備平均 20 年產業或創投經驗。' },
  { category: '業師與輔導', question: '如何成為台大創創中心業師？', answer: '若您具備創業、投資、技術或產業管理經驗，有意回饋創業生態系，歡迎填寫業師申請表或直接聯繫中心。業師遴選以與中心聚焦領域的契合度與實戰經驗為主要依據。' },
  { category: '聯絡與其他', question: '如何聯繫台大創創中心？', answer: '可透過官網聯絡表單、電子郵件（ntutec@ntutec.com）或直接前往台大創創中心辦公室洽詢。辦公時間為週一至週五 9:00–18:00。' },
  { category: '聯絡與其他', question: '台大創創中心的辦公室在哪裡？', answer: '台大創創中心位於台北市中正區思源街 18 號，台大水源校區卓越研究大樓 7 樓。輔導計畫採虛擬進駐模式，學員可預約使用中心會議室與活動場地。' },
  { category: '聯絡與其他', question: 'Demo Day 是什麼？', answer: 'Demo Day 是台大創創中心每年 12 月舉辦的年度成果展暨投資媒合活動，由當年梯次精選新創向投資人 Pitch，設有互動攤位與媒合機制。' },
  { category: '聯絡與其他', question: '台大創創中心有 Podcast 嗎？', answer: '有。TEC Talk 是台大創創中心的官方 Podcast，自 2021 年開播，邀請業師、知名創業者與產業專家分享創業經驗。可在 Firstory 及 Spotify 等主流平台收聽。' },
];

const CATEGORIES = ['計畫相關', '申請相關', '台大天使會', '企業合作', '業師與輔導', '聯絡與其他'];

function AccordionItem({ item, isOpen, onToggle }) {
  return (
    <div style={{ borderTop: '1px solid var(--rule)' }}>
      <button onClick={onToggle} style={{ display: 'flex', width: '100%', alignItems: 'center', justifyContent: 'space-between', gap: 16, padding: '24px 0', background: 'none', border: 'none', cursor: 'pointer', textAlign: 'left' }}>
        <span style={{ fontFamily: 'var(--serif)', fontSize: 16, fontWeight: 600, color: 'var(--text)', paddingRight: 16 }}>{item.question}</span>
        <span style={{ color: isOpen ? 'var(--teal)' : 'var(--muted)', fontSize: 20, flexShrink: 0, fontWeight: 300 }}>{isOpen ? '−' : '+'}</span>
      </button>
      {isOpen && (
        <div style={{ paddingBottom: 24 }}>
          <p style={{ fontFamily: 'var(--serif)', fontSize: 14, fontWeight: 300, lineHeight: 1.95, color: 'var(--muted)' }}>{item.answer}</p>
        </div>
      )}
    </div>
  );
}

function Hero() {
  const [loaded, setLoaded] = useState(false);
  const isMobile = useIsMobile();
  useEffect(() => { const t = setTimeout(() => setLoaded(true), 80); return () => clearTimeout(t); }, []);
  return (
    <div style={{ position: 'relative' }}>
      <section style={{ position: 'relative', overflow: 'hidden', minHeight: isMobile ? 360 : 560 }}>
        <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(135deg, var(--navy) 0%, #0D1E33 60%, #1A3A5A 100%)' }} />
        <svg style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', pointerEvents: 'none', zIndex: 3 }} viewBox="0 0 1200 560" preserveAspectRatio="none">
          <polygon points="0,0 280,0 0,130" fill="#F7F5F1" />
          <polygon points="1200,560 920,560 1200,430" fill="#F7F5F1" />
        </svg>
        <div style={{ position: 'relative', zIndex: 2, maxWidth: 1280, margin: '0 auto', padding: isMobile ? '100px 6% 60px' : '160px 10% 100px' }}>
          <div style={{ opacity: loaded ? 1 : 0, transform: loaded ? 'none' : 'translateY(20px)', transition: 'opacity 0.65s 0.1s', fontFamily: 'var(--mono)', fontSize: 11, letterSpacing: '0.18em', color: 'var(--mint)', textTransform: 'uppercase', marginBottom: 20 }}>FAQ</div>
          <h1 style={{ opacity: loaded ? 1 : 0, transform: loaded ? 'none' : 'translateY(24px)', transition: 'opacity 0.65s 0.2s', fontFamily: 'var(--sans)', fontSize: isMobile ? 36 : 56, fontWeight: 600, lineHeight: 1.12, color: '#fff', marginBottom: 24 }}>常見問題</h1>
          <p style={{ opacity: loaded ? 1 : 0, transform: loaded ? 'none' : 'translateY(20px)', transition: 'opacity 0.65s 0.3s', fontFamily: 'var(--serif)', fontSize: 15, fontWeight: 300, lineHeight: 2, color: 'rgba(255,255,255,0.8)', maxWidth: 520 }}>關於計畫申請、天使投資、企業合作、業師輔導與其他常見疑問的完整解答。</p>
        </div>
      </section>
    </div>
  );
}

function FaqSection() {
  const [activeCategory, setActiveCategory] = useState('計畫相關');
  const [openIndex, setOpenIndex] = useState(null);
  const isMobile = useIsMobile();
  const filtered = FAQS.filter(f => f.category === activeCategory);

  return (
    <section style={{ padding: isMobile ? '72px 0' : '120px 0', background: '#fff' }}>
      <div style={{ maxWidth: 1280, margin: '0 auto', padding: isMobile ? '0 6%' : '0 10%' }}>
        {/* Category tabs */}
        <AnimUp style={{ marginBottom: 48 }}>
          <span className="sec-en">分類</span>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginTop: 16 }}>
            {CATEGORIES.map(cat => (
              <button key={cat} onClick={() => { setActiveCategory(cat); setOpenIndex(null); }} style={{ padding: '8px 18px', borderRadius: 20, fontFamily: 'var(--sans)', fontSize: 13, fontWeight: 500, cursor: 'pointer', transition: 'all 0.2s', background: activeCategory === cat ? 'var(--teal)' : 'transparent', color: activeCategory === cat ? '#fff' : 'var(--muted)', border: activeCategory === cat ? 'none' : '1px solid var(--rule)' }}>{cat}</button>
            ))}
          </div>
        </AnimUp>
        {/* Accordion */}
        <div style={{ maxWidth: 800 }}>
          <p style={{ fontFamily: 'var(--mono)', fontSize: 11, fontWeight: 500, letterSpacing: '0.14em', color: 'var(--teal)', textTransform: 'uppercase', marginBottom: 24 }}>{activeCategory}</p>
          {filtered.map((item, i) => (
            <AccordionItem key={i} item={item} isOpen={openIndex === i} onToggle={() => setOpenIndex(openIndex === i ? null : i)} />
          ))}
          <div style={{ borderTop: '1px solid var(--rule)' }} />
        </div>
      </div>
    </section>
  );
}

function CTA() {
  const isMobile = useIsMobile();
  return (
    <section style={{ padding: isMobile ? '48px 6%' : '80px 10%', background: 'var(--offwhite)' }}>
      <div style={{ maxWidth: 1280, margin: '0 auto' }}>
        <AnimUp>
          <div style={{ background: 'var(--navy)', borderRadius: 4, padding: isMobile ? '48px 32px' : '72px 80px', textAlign: 'center' }}>
            <h2 style={{ fontFamily: 'var(--serif)', fontSize: isMobile ? 26 : 34, fontWeight: 600, color: '#fff', lineHeight: 1.4, marginBottom: 16 }}>找不到答案？</h2>
            <p style={{ fontFamily: 'var(--sans)', fontSize: 15, fontWeight: 300, color: 'rgba(255,255,255,0.7)', lineHeight: 1.8, maxWidth: 400, margin: '0 auto 32px' }}>歡迎直接來信，我們將於 3 個工作日內回覆。</p>
            <a href="mailto:ntutec@ntutec.com" style={{ display: 'inline-block', background: 'var(--mint)', color: 'var(--navy)', fontFamily: 'var(--serif)', fontWeight: 600, fontSize: 15, padding: '14px 40px', borderRadius: 2 }}>寄信給我們</a>
          </div>
        </AnimUp>
      </div>
    </section>
  );
}

function Page() {
  const isMobile = useIsMobile();
  return (
    <div style={{ maxWidth: '100vw', overflowX: 'hidden' }}>
      <SharedNav activeKey="最新動態" />
      <SharedSocialSidebar />
      <main style={{ paddingRight: isMobile ? 0 : 80 }}>
        <Hero />
        <FaqSection />
        <CTA />
      </main>
      <div style={{ paddingRight: isMobile ? 0 : 80 }}>
        <SharedFooter />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
</body>
</html>
