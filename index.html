/* ── useInView hook ─────────────────────────────────── */
function useInView(options = {}) {
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { setInView(true); obs.disconnect(); }
    }, { threshold: options.threshold || 0.3, rootMargin: options.rootMargin || '-240px 0px' });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return [ref, inView];
}

/* ── useIsMobile hook ───────────────────────────────── */
function useIsMobile(bp = 768) {
  const [mobile, setMobile] = useState(
    typeof window !== 'undefined' ? window.innerWidth <= bp : false
  );
  useEffect(() => {
    const h = () => setMobile(window.innerWidth <= bp);
    window.addEventListener('resize', h, { passive: true });
    return () => window.removeEventListener('resize', h);
  }, [bp]);
  return mobile;
}

/* ── AnimBlock: wraps children with scroll-triggered animation ── */
function AnimBlock({ children, animation = 'anim-fadeUp', delay = 0, style = {} }) {
  const [ref, inView] = useInView();
  return (
    <div ref={ref} className={inView ? animation : 'anim-hidden'}
      style={{ animationDelay: delay + 'ms', ...style }}>
      {children}
    </div>
  );
}

function useCountUp(target, duration = 1400, started = false) {
  const [count, setCount] = useState(0);
  useEffect(() => {
    if (!started) return;
    let start = null;
    const step = (ts) => {
      if (!start) start = ts;
      const progress = Math.min((ts - start) / duration, 1);
      const ease = 1 - Math.pow(1 - progress, 3);
      setCount(Math.floor(ease * target));
      if (progress < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }, [started, target, duration]);
  return count;
}

      href: 'consulting.html',
      img: 'images/events/demo-day-2025-01.jpg',
      pos: '50% 20%',
    },
  ];

  function renderCard(idx, height, isBig) {
    const e = entries[idx];
    const active = hovered === idx;
    const dark = isBig;
    const delay = idx * 60;
    const lift = active ? (isBig ? '0 12px 40px rgba(26,46,74,0.18)' : '0 8px 32px rgba(88,168,160,0.28)') : '0 2px 20px rgba(26,46,74,0.09)';

    // SVG clip shape params (from Rectangle image_lg / image_sml)
    const clipVW = isBig ? 206 : 223;
    const clipVH = isBig ? 192 : 102;
    const clipRx = isBig ? '-2.76074' : '91.8853';
    const clipRy = isBig ? '35.8774'  : '-97.2676';
    const clipRW = isBig ? '245.194'  : '208.899';
    const clipRH = isBig ? '245.194'  : '208.899';
    const clipRot = isBig ? 'rotate(-11.0219 -2.76074 35.8774)' : 'rotate(27.8224 91.8853 -97.2676)';
    const gradSrc = isBig ? 'public/Rectangle graidents_01.svg' : 'public/Rectangle graidents_02.svg';
    const clipId = `imgclip-${idx}`;

    return (
      <a key={idx} href={e.href}
        onMouseEnter={() => setHovered(idx)}
        onMouseLeave={() => setHovered(null)}
        style={{
          position: 'relative', overflow: 'hidden',
          display: 'flex', flexDirection: 'column', justifyContent: isBig ? 'flex-end' : 'center',
          height, borderRadius: 4, textDecoration: 'none',
          background: dark ? (idx === 1 || idx === 2 ? '#00DCC8' : 'var(--teal)') : '#fff',
          boxShadow: lift,
          transform: !inView ? 'translateY(22px)' : active ? 'translateY(-3px)' : 'none',
          opacity: inView ? 1 : 0,
          transition: `box-shadow 0.22s, transform 0.22s, opacity 0.6s ${delay}ms cubic-bezier(0.22,1,0.36,1)`,
        }}>

        {/* ── Photo clipped with exact SVG rotated-rect shape ── */}
        <svg viewBox={`0 0 ${clipVW} ${clipVH}`} xmlns="http://www.w3.org/2000/svg"
          style={{ position: 'absolute', right: 0, top: 0, height: '100%', width: 'auto', zIndex: 1, display: 'block', overflow: 'visible' }}>
          <defs>
            <clipPath id={clipId} clipPathUnits="userSpaceOnUse">
              <rect x={clipRx} y={clipRy} width={clipRW} height={clipRH} rx="16" transform={clipRot}/>
            </clipPath>
          </defs>
          <foreignObject x="0" y="0" width={clipVW} height={clipVH} clipPath={`url(#${clipId})`}>
            <img xmlns="http://www.w3.org/1999/xhtml" src={e.img}
              style={{ width: '100%', height: '100%', objectFit: 'cover', objectPosition: e.pos, display: 'block' }}/>
          </foreignObject>
        </svg>

        {/* ── Text ── */}
        <div style={{
          position: 'relative', zIndex: 3,
          padding: isBig ? '0 32px 28px' : '0 24px',
          maxWidth: isBig ? '52%' : '55%',
        }}>
          <div style={{

          }}>
            {e.icon}
            <span style={{
              fontFamily: 'var(--serif)', fontWeight: 600,
              fontSize: isBig ? 22 : 17,
              color: dark ? '#fff' : 'var(--navy)',
            }}>{e.title}</span>
          </div>
          <div style={{
            fontFamily: 'var(--sans)', fontWeight: 300,
            fontSize: isBig ? 13 : 12, lineHeight: 1.65,
            color: dark ? 'rgba(255,255,255,0.72)' : 'var(--muted)',
          }}>{e.desc}</div>
        </div>
      </a>
    );
  }

  if (isMobile) {
    return (
      <section ref={ref} style={{ padding: '72px 6%', background: 'var(--white)' }}>
        <div style={{ marginBottom: 36, opacity: inView ? 1 : 0, transform: inView ? 'none' : 'translateY(16px)', transition: 'opacity 0.6s, transform 0.6s' }}>
          <div style={{ fontFamily: 'var(--mono)', fontSize: 11, fontWeight: 500, letterSpacing: '0.14em', color: 'var(--teal)', textTransform: 'uppercase', marginBottom: 12 }}>Find Your Path</div>
          <h2 style={{ fontFamily: 'var(--serif)', fontSize: 28, fontWeight: 600, color: 'var(--navy)' }}>馬上找到你的合作機會</h2>
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: GAP }}>
          {entries.map((_, i) => renderCard(i, SMALL, false))}
        </div>
      </section>
    );
  }

  return (
    <section ref={ref} style={{ padding: '96px 10%', background: 'var(--white)' }}>
      <div style={{ marginBottom: 48, opacity: inView ? 1 : 0, transform: inView ? 'none' : 'translateY(16px)', transition: 'opacity 0.6s, transform 0.6s' }}>

      </div>

      {/* Bento: left=small/big/small  right=big/small/small */}
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: GAP }}>
        <div style={{ display: 'flex', flexDirection: 'column', gap: GAP }}>
          {leftEntries.map((idx, ci) => renderCard(idx, leftHeights[ci], ci === 1))}
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: GAP }}>
          {rightEntries.map((idx, ci) => renderCard(idx, rightHeights[ci], ci === 0))}
        </div>
      </div>
    </section>
  );
}

/* ── JOURNEY / 2026 PROGRAM TIMELINE ───────────────── */
function Journey() {
  const isMobile = useIsMobile();
  const phases = [
    { month: 'Jan — Feb', num: '01', title: '報名徵件',  desc: '開放新創團隊線上投件，評審委員初步篩選。',             state: 'done'   },
    { month: 'Feb — Mar', num: '02', title: '審核錄取',  desc: '提案書審查、團隊訪談，遴選最具潛力的創業者。',         state: 'done'   },
    { month: 'Mar',       num: '03', title: '計畫開幕',  desc: '正式公告錄取名單，召開說明會與開幕典禮。',             state: 'done'   },
    { month: 'Mar — Jun', num: '04', title: '密集輔導',  desc: '每週業師諮詢、主題工作坊、企業參訪與場域驗證。',       state: 'active' },
    { month: 'Jun — Jul', num: '05', title: '中期審查',  desc: '商模驗證成果發表，調整後半段輔導策略與方向。',         state: 'future' },
    { month: 'Aug',       num: '06', title: 'Demo Day',  desc: '公開展示發表，媒合投資人、企業與潛在合作夥伴。',       state: 'future' },
  ];

  const N = 22; // notch depth px

  const getClip = (i, total) => {
    const first = i === 0;
    const last  = i === total - 1;
    if (first && last) return 'polygon(0 0, 100% 0, 100% 100%, 0 100%)';
    if (first) return `polygon(0 0, calc(100% - ${N}px) 0, 100% 50%, calc(100% - ${N}px) 100%, 0 100%)`;
    if (last)  return `polygon(0 0, 100% 0, 100% 100%, 0 100%, ${N}px 50%)`;
    return `polygon(0 0, calc(100% - ${N}px) 0, 100% 50%, calc(100% - ${N}px) 100%, 0 100%, ${N}px 50%)`;
  };

  // Palette — active uses a vibrant teal-cyan with good chroma
  const palette = {
    done:   { bg: '#E2E2DE', numCol: '#777774', monthCol: '#888884', titleCol: '#444441', descCol: '#777774' },
    active: { bg: '#009E98', numCol: 'rgba(255,255,255,0.32)', monthCol: 'rgba(255,255,255,0.58)', titleCol: '#fff', descCol: 'rgba(255,255,255,0.76)' },
    future: { bg: 'rgba(0,158,152,0.09)', numCol: 'rgba(0,140,134,0.3)', monthCol: 'rgba(0,140,134,0.45)', titleCol: 'rgba(0,100,96,0.6)', descCol: 'rgba(0,120,115,0.38)' },
  };

  const [visible, setVisible] = useState(false);
  const journeyRef = useRef(null);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setVisible(true); obs.disconnect(); } }, { threshold: 0.15 });
    if (journeyRef.current) obs.observe(journeyRef.current);
    return () => obs.disconnect();
  }, []);

  return (
    <section style={{ background: '#EEEEED', padding: isMobile ? '56px 0 48px' : '100px 0 88px', overflow: 'hidden' }}>
      {/* Header */}
      <div style={{ padding: isMobile ? '0 6%' : '0 10%', marginBottom: isMobile ? 36 : 64 }}>
        <div style={{ display: 'flex', flexDirection: isMobile ? 'column' : 'row', justifyContent: 'space-between', alignItems: isMobile ? 'flex-start' : 'flex-end', gap: isMobile ? 12 : 0 }}>
          <div>
            <span style={{ fontFamily: 'var(--mono)', fontSize: 11, fontWeight: 500, letterSpacing: '0.14em', color: 'var(--teal)', textTransform: 'uppercase', display: 'block', marginBottom: 14 }}>
              2026 Program Journey
            </span>
            <h2 style={{ fontFamily: 'var(--serif)', fontWeight: 600, fontSize: isMobile ? 26 : 36, color: 'var(--navy)', lineHeight: 1.3, letterSpacing: '0.02em' }}>
              讓好想法，長出{' '}
              <span style={{ background: 'var(--mint)', color: 'var(--navy)', padding: '2px 8px', WebkitBoxDecorationBreak: 'clone', boxDecorationBreak: 'clone' }}>
                改變世界的力量
              </span>
            </h2>
          </div>
          {!isMobile && (
            <p style={{ fontFamily: 'var(--sans)', fontSize: 15, fontWeight: 300, color: 'var(--muted)', lineHeight: 1.85, maxWidth: 300, textAlign: 'right' }}>
              2026 輔導計畫，逾 80 位創業者與業師<br/>齊聚台大，展開十個月的創業加速旅程。
            </p>
          )}
        </div>
      </div>

      {/* Steps */}
      <div ref={journeyRef} style={{ padding: isMobile ? '0 6%' : '0 10%' }}>
        {isMobile ? (
          /* Mobile: vertical list */
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            {phases.map((p, i) => {
              const pal = palette[p.state];
              return (
                <div key={i} style={{
                  background: pal.bg, borderRadius: 4,
                  padding: '20px 20px',
                  display: 'flex', gap: 16, alignItems: 'flex-start',
                  opacity: visible ? 1 : 0,
                  transform: visible ? 'none' : 'translateY(12px)',
                  transition: `opacity 0.4s ease ${i * 60}ms, transform 0.4s ease ${i * 60}ms`,
                }}>
                  <div style={{ flexShrink: 0, textAlign: 'center', width: 36 }}>
                    <div style={{ fontFamily: 'var(--mono)', fontSize: 8, letterSpacing: '0.1em', color: pal.monthCol, textTransform: 'uppercase', marginBottom: 2 }}>STEP</div>
                    <div style={{ fontFamily: 'var(--mono)', fontSize: 28, fontWeight: 600, color: pal.numCol, lineHeight: 1 }}>{p.num}</div>
                  </div>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontFamily: 'var(--mono)', fontSize: 9, letterSpacing: '0.1em', color: pal.monthCol, marginBottom: 4 }}>{p.month}</div>
                    <div style={{ fontFamily: 'var(--serif)', fontSize: 15, fontWeight: 600, color: pal.titleCol, lineHeight: 1.3, marginBottom: 6 }}>{p.title}</div>
                    <div style={{ fontFamily: 'var(--sans)', fontSize: 13, fontWeight: 300, color: pal.descCol, lineHeight: 1.7 }}>{p.desc}</div>
                    {p.state === 'active' && (
                      <div style={{ marginTop: 10, display: 'inline-flex', alignItems: 'center', gap: 6 }}>
                        <div style={{ width: 6, height: 6, borderRadius: '50%', background: 'rgba(255,255,255,0.7)' }} />
                        <span style={{ fontFamily: 'var(--mono)', fontSize: 9, fontWeight: 700, color: 'rgba(255,255,255,0.8)', letterSpacing: '0.1em' }}>進行中</span>
                      </div>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        ) : (
          /* Desktop: horizontal chevron strip */
          <div style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
            {phases.map((p, i) => {
              const pal = palette[p.state];
              return (
                <div key={i} style={{
                  flex: 1,
                  opacity: visible ? 1 : 0,
                  transform: visible ? 'none' : 'translateX(-20px)',
                  transition: `opacity 0.5s cubic-bezier(0.22,1,0.36,1) ${i * 85}ms, transform 0.5s cubic-bezier(0.22,1,0.36,1) ${i * 85}ms`,
                }}>
                  <div style={{
                    clipPath: getClip(i, phases.length),
                    background: pal.bg,
                    padding: `32px ${i === phases.length - 1 ? 26 : N + 18}px 32px ${i === 0 ? 28 : N + 18}px`,
                    minHeight: 230,
                    display: 'flex', flexDirection: 'column', justifyContent: 'center',
                  }}>
                    <div style={{ fontFamily: 'var(--mono)', fontSize: 9, letterSpacing: '0.14em', color: pal.monthCol, textTransform: 'uppercase', marginBottom: 4 }}>STEP</div>
                    <div style={{ fontFamily: 'var(--mono)', fontSize: 38, fontWeight: 600, color: pal.numCol, lineHeight: 1, letterSpacing: '-0.02em', marginBottom: 12 }}>{p.num}</div>
                    <div style={{ fontFamily: 'var(--mono)', fontSize: 9, letterSpacing: '0.1em', color: pal.monthCol, marginBottom: 10 }}>{p.month}</div>
                    <div style={{ fontFamily: 'var(--serif)', fontSize: 15, fontWeight: 600, color: pal.titleCol, lineHeight: 1.35, marginBottom: 10 }}>{p.title}</div>
                    <div style={{ fontFamily: 'var(--sans)', fontSize: 12, fontWeight: 300, color: pal.descCol, lineHeight: 1.75 }}>{p.desc}</div>
                    {p.state === 'active' && (
                      <div style={{ marginTop: 18, display: 'inline-flex', alignItems: 'center', gap: 6 }}>
                        <div style={{ width: 6, height: 6, borderRadius: '50%', background: 'rgba(255,255,255,0.55)' }} />
                        <span style={{ fontFamily: 'var(--mono)', fontSize: 9, fontWeight: 700, color: 'rgba(255,255,255,0.72)', letterSpacing: '0.1em' }}>進行中</span>
                      </div>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>
    </section>
  );
}

/* ── APP ─────────────────────────────────────────────── */
function App() {
  const [scrolled, setScrolled] = useState(false);
  const [scrollY, setScrollY] = useState(0);
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const isMobile = useIsMobile();

  useEffect(() => {
    const h = () => { setScrolled(window.scrollY > 60); setScrollY(window.scrollY); };
    window.addEventListener('scroll', h, { passive: true });
    return () => window.removeEventListener('scroll', h);
  }, []);

  return (
    <div style={{ maxWidth: '100vw', overflowX: 'hidden' }}>
      <Nav scrolled={scrolled} />
      {!isMobile && <SocialSidebar scrollY={scrollY} />}
      <div style={{ paddingRight: isMobile ? 0 : 80, maxWidth: '100vw', overflowX: 'hidden' }}>
        <Hero tweaks={tweaks} scrollY={scrollY} />
        <Stats />
        <FindYourPath />
        <FocusAreas />
        <Journey />
        <News />
        <About />
        <Programs />
        <Ecosystem />
        <Corporate />
        <Angel show={tweaks.showAngel} scrollY={scrollY} />
        <Blog />
        <RoleCTA />
        <Footer />
      </div>
      <TweaksPanel>
        <TweakSection title="Hero 文案">
          <TweakText id="heroJP" label="中文主標" />
          <TweakText id="heroEN" label="英文主標" />
        </TweakSection>
        <TweakSection title="色彩">
          <TweakColor id="accentColor" label="強調色 (Mint)" />
        </TweakSection>
        <TweakSection title="區塊">
          <TweakToggle id="showAngel" label="顯示天使投資俱樂部" />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
